# Secret scanning configuration (scripts/security-scan.sh).
# The default gitleaks rule set applies in full. The allowlist below names individual values that
# are synthetic test data, each reviewed by hand: fixed test passwords of the e2e and adversarial
# suites, base64-encoded descriptive strings used as e-mail tokens in unit tests, and example JWTs
# whose signature segment is the literal text "signature" (contract example, generated web types,
# log-redaction tests). They are matched by their exact value, so any other value in the same
# files is still reported. Add a value only after confirming it grants access to nothing.

title = "vitadelta"

[extend]
useDefault = true

[[allowlists]]
description = "Reviewed synthetic test values (exact matches)"
regexTarget = "secret"
regexes = [
