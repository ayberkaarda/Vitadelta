# Security headers shared by every location (project specification section 15.2).
# add_header directives are not inherited into a location that declares its own,
# so each location includes this file and adds its Referrer-Policy itself.
# "always" makes nginx send them on error responses too.
add_header Content-Security-Policy $vitadelta_csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Empty unless VITADELTA_TLS=true; nginx omits a header whose value is empty.
add_header Strict-Transport-Security $vitadelta_hsts always;
