worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Query strings are never logged: $uri instead of $request_uri or $request,
    # and no Referer field (it may carry another page's query string).
    log_format vitadelta '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time "$http_user_agent" '
                         'request_id="$vitadelta_request_id"';
    access_log /var/log/nginx/access.log vitadelta;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Client-address restoration behind a trusted proxy (empty unless VITADELTA_REAL_IP_FROM is set).
    include /etc/nginx/generated/real-ip.conf;

    include /etc/nginx/conf.d/*.conf;
}
