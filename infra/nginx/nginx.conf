# The master and the workers run as the unprivileged image user (USER in infra/nginx/Dockerfile);
# nginx listens on 8080 and keeps its pid file and temporary files under /tmp.
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Query strings are never logged: a sanitised $uri instead of $request_uri or $request
    # ($vitadelta_log_uri masks promo codes and token-like path segments; it is defined in the
    # server template), and no Referer field (it may carry another page's query string).
    log_format vitadelta '$remote_addr [$time_local] "$request_method $vitadelta_log_uri $server_protocol" '
                         '$status $body_bytes_sent $request_time "$http_user_agent" '
                         'request_id="$vitadelta_request_id"';
    access_log /var/log/nginx/access.log vitadelta;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/conf.d/*.conf;
}
