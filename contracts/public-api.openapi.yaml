openapi: 3.1.0
info:
  title: Vitadelta Public API
  version: 1.0.0
  summary: Multivitamin ranking, comparison, accounts, watchlists and alerts.
  description: |
    Public REST API of the Vitadelta core service. All paths are relative to the
    base path `/api/v1`.

    Conventions:
    - JSON property names are camelCase; enumeration values are UPPER_SNAKE.
    - Money and score values are JSON numbers rounded once to 4 decimals
      (round-half-even). FX rates are returned unrounded with their stored
      8 decimals.
    - Every monetary field is expressed in `meta.currency` (the display currency).
      Native-currency values are additionally returned in `*Native` fields of
      cost and offer objects. `valueScore` is never converted: it is content
      points per unit of `meta.nativeCurrency` per day.
    - Errors use RFC 9457 `application/problem+json`. The problem `type` is
      `https://vitadelta.dev/problems/<code>`; generic HTTP errors without
      additional semantics (for example an unknown alert id) use `about:blank`.
    - A request body over the size limit is answered with 413 `validation_failed`
      before it is processed. A JSON operation called with another content type
      answers 415 (`about:blank`), except the cookie-scoped auth operations,
      which answer 403 `forbidden`.
    - Every request may carry `X-Request-Id`; every response echoes the id in
      effect for that request in `X-Request-Id`.
    - Principals: `ANONYMOUS` (signed `vd_anon` cookie), `USER` and `ADMIN`
      (bearer access token). Operations with `security: []` need no credentials.
      Operations that list an empty security requirement next to `bearerAuth`
      and `anonCookie` accept every principal and adapt the response to it.
servers:
  - url: /api/v1
    description: Same-origin deployment; the web server proxies `/api/` to the API.
tags:
  - name: System
    description: Liveness and legal information.
  - name: Reference
    description: Countries, nutrient registry and default weights.
  - name: Session
    description: Anonymous trial quota and usage summary of the current principal.
  - name: Recommendations
    description: Ranked recommendations and pairwise marginal analysis.
  - name: Products
    description: Product search and product detail within one country.
  - name: Plans
    description: Plan limits and prices.
  - name: FX
    description: Display currencies and exchange rates used for display conversion.
  - name: Auth
    description: Registration, e-mail verification, login, token refresh, logout and password reset.
  - name: Account
    description: Profile, plan, usage meters and account deletion of the signed-in user.
  - name: SavedProducts
    description: Products saved by the signed-in user per country.
  - name: Alerts
    description: Alert subscriptions on products (price drop, back in stock, any price change).
  - name: Notifications
    description: In-app notification inbox.
  - name: Subscription
    description: Plan activation by promo code.
  - name: AdminImports
    description: Catalog, availability and offer imports. Requires role ADMIN.
  - name: AdminUsers
    description: User administration and manual plan grants. Requires role ADMIN.
  - name: AdminPromoCodes
    description: Promo code management. Requires role ADMIN.
  - name: AdminOperations
    description: Detailed health, FX refresh and outbox statistics. Requires role ADMIN.

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Minimal liveness status
      description: |
        Returns only the aggregated status. No dependency names, versions or
        backlog figures are exposed. `DOWN` is returned with status 503.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: The service is up or degraded.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: UP }
        '503':
          description: The service is down.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: DOWN }

  /legal:
    get:
      tags: [System]
      operationId: getLegal
      summary: Privacy notice information
      description: Returns the controller contact rendered on the privacy notice page.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Legal information.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalInfo' }
        '500': { $ref: '#/components/responses/InternalError' }

  /countries:
    get:
      tags: [Reference]
      operationId: listCountries
      summary: List supported countries
      description: Supported countries with currency, reference set, upper-limit set and default locale.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Supported countries.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountryList' }
              example:
                items:
                  - { code: TR, nameEn: Türkiye, currency: TRY, referenceSetCode: EU_NRV, ulSetCode: EFSA, defaultLocale: tr }
                  - { code: DE, nameEn: Germany, currency: EUR, referenceSetCode: EU_NRV, ulSetCode: EFSA, defaultLocale: en }
                  - { code: GB, nameEn: United Kingdom, currency: GBP, referenceSetCode: EU_NRV, ulSetCode: EFSA, defaultLocale: en }
                  - { code: US, nameEn: United States, currency: USD, referenceSetCode: US_DV, ulSetCode: IOM, defaultLocale: en }
        '500': { $ref: '#/components/responses/InternalError' }

  /nutrients:
    get:
      tags: [Reference]
      operationId: listNutrients
      summary: Nutrient registry
      description: Registry with categories, canonical units and the reference sets that define a value for each nutrient.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Nutrient registry ordered by `sortOrder`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NutrientList' }
              example:
                items:
                  - { code: VIT_C, nameEn: Vitamin C, category: VITAMIN, canonicalUnit: mg, presenceFloorPerDay: null, sortOrder: 30, referenceSetCodes: [EU_NRV, US_DV] }
                  - { code: COQ10, nameEn: Coenzyme Q10, category: COENZYME, canonicalUnit: mg, presenceFloorPerDay: null, sortOrder: 300, referenceSetCodes: [] }
        '500': { $ref: '#/components/responses/InternalError' }

  /weights/defaults:
    get:
      tags: [Reference]
      operationId: getDefaultWeights
      summary: Default weights and allowed ranges
      description: |
        Default category weights, the default per-nutrient override and the
        allowed ranges of category weights, overrides and the CUSTOM-mode lambda.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Default category weights, override default and the allowed ranges.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefaultWeights' }
              example:
                categories: { VITAMIN: 1.0, MINERAL: 1.0, COENZYME: 0.8, OTHER: 0.5 }
                categoryRange: { min: 0.0, max: 2.0 }
                overrideDefault: 1.0
                overrideRange: { min: 0.0, max: 3.0 }
                lambdaDefault: 0.5
                lambdaRange: { min: 0.0, max: 1.0 }
        '500': { $ref: '#/components/responses/InternalError' }

  /session/quota:
    get:
      tags: [Session]
      operationId: getSessionQuota
      summary: Quota counters of the current principal
      description: |
        For anonymous callers returns the trial counters and creates the `vd_anon`
        cookie when it is missing. A missing or invalid (tampered) cookie
        creates a new identity; creation is limited to 60 per hour per client
        IP, while requests with a valid cookie are never limited by it. For
        signed-in users returns the plan usage summary of `GET /me`.

        Problem codes: `unauthorized` (401, invalid bearer token),
        `rate_limited` (429, anonymous identity creation).
      security:
        - {}
        - bearerAuth: []
        - anonCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Quota or usage summary.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Set-Cookie: { $ref: '#/components/headers/SetCookieAnon' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionQuota' }
              examples:
                anonymous:
                  summary: Anonymous principal after one query
                  value: { principal: ANONYMOUS, queriesUsed: 1, queriesLimit: 3, visibleResults: 3 }
                freeUser:
                  summary: FREE user
                  value:
                    principal: USER
                    plan: FREE
                    usage:
                      savedProducts: { used: 2, limit: 5 }
                      alertSubscriptions: { used: 1, limit: 3 }
                      notificationsThisMonth: { used: 4, limit: 30, periodMonth: '2026-11-01' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /recommendations/query:
    post:
      tags: [Recommendations]
      operationId: queryRecommendations
      summary: Ranked recommendations
      description: |
        Scores every in-market product of the country and returns the ranking.

        - ANONYMOUS: consumes one trial query (3 per anonymous identity); the
          response contains only the top 3 items of the full ranking regardless
          of `page`; `page > 1` returns an empty `items` array with the same
          `meta.visibility`. Locked items are not sent in any form. The `vd_anon`
          cookie is created when missing. A query failing with 503 does not
          consume quota.
        - USER / ADMIN: unlimited, full paged results.

        Problem codes: `validation_failed` (422; `errors[].code` includes
        `weights_all_zero`, `unit_requires_form`), `country_not_found` (422),
        `fx_unsupported_currency` (422), `quota_exceeded` (403),
        `unauthorized` (401, invalid bearer token), `rate_limited` (429,
        anonymous callers 30 per day per IP), `scoring_unavailable` (503),
        request body larger than 64 kB (413).
      security:
        - {}
        - bearerAuth: []
        - anonCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationQueryRequest' }
            example:
              country: TR
              stockFilter: IN_STOCK_ONLY
              ranking: { mode: VALUE }
              weights:
                categories: { VITAMIN: 1.0, MINERAL: 1.0, COENZYME: 0.8, OTHER: 0.5 }
                overrides: { VIT_C: 1.5 }
              requiredNutrients:
                - { code: VIT_C, minAmountPerDay: 300, unit: mg }
              excludeExceedingUl: false
              displayCurrency: USD
              page: 1
              pageSize: 20
      responses:
        '200':
          description: Ranked page of recommendations.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Set-Cookie: { $ref: '#/components/headers/SetCookieAnon' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationQueryResponse' }
              examples:
                goldenPairValueMode:
