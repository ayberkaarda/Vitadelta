openapi: 3.1.0
info:
  title: Vitadelta Public API
  version: 1.0.0
  summary: Multivitamin ranking, comparison, accounts, watchlists and alerts.
  description: |
    Public REST API of the Vitadelta core service. All paths are relative to the
    base path `/api/v1`.

    Conventions:
    - JSON property names are camelCase; enumeration values are UPPER_SNAKE.
    - Money and score values are JSON numbers rounded once to 4 decimals
      (round-half-even). FX rates are returned unrounded with their stored
      8 decimals.
    - Every monetary field of a response with `meta.fx` is expressed in
      `meta.currency` (the display currency). Native-currency values are
      additionally returned in `*Native` fields of cost, offer, plan-price and
      compare-delta objects. `valueScore` is never converted: it is content
      points per unit of `meta.nativeCurrency` per day. Exceptions, always
      native and never converted, also inside a response with `meta.fx`:
      `AlertSubscription.baselinePrice` (currency `baselineCurrency`) and the
      amounts of notification payloads (currency `payload.currency`).
    - Errors use RFC 9457 `application/problem+json`. The problem `type` is
      `https://vitadelta.dev/problems/<code>`; generic HTTP errors without
      additional semantics (for example an unknown alert id) use `about:blank`.
    - A request body over the size limit is answered with 413 `validation_failed`
      before it is processed. A JSON operation called with another content type
      answers 415 (`about:blank`), except the cookie-scoped auth operations,
      which answer 403 `forbidden`.
    - Every request may carry `X-Request-Id`; every response echoes the id in
      effect for that request in `X-Request-Id`.
    - Principals: `ANONYMOUS` (signed `vd_anon` cookie), `USER` and `ADMIN`
      (bearer access token). Operations with `security: []` need no credentials.
      Operations that list an empty security requirement next to `bearerAuth`
      and `anonCookie` accept every principal and adapt the response to it.
    - A request URL the server rejects before routing (encoded slashes or
      backslashes, dot segments, path parameters, empty segments) is answered
      400 with an `about:blank` problem.
servers:
  - url: /api/v1
    description: Same-origin deployment; the web server proxies `/api/` to the API.
tags:
  - name: System
    description: Liveness and legal information.
  - name: Reference
    description: Countries, nutrient registry and default weights.
  - name: Session
    description: Anonymous trial quota and usage summary of the current principal.
  - name: Recommendations
    description: Ranked recommendations and pairwise marginal analysis.
  - name: Products
    description: Product search and product detail within one country.
  - name: Plans
    description: Plan limits and prices.
  - name: FX
    description: Display currencies and exchange rates used for display conversion.
  - name: Auth
    description: Registration, e-mail verification, login, token refresh, logout and password reset.
  - name: Account
    description: Profile, plan, usage meters and account deletion of the signed-in user.
  - name: SavedProducts
    description: Products saved by the signed-in user per country.
  - name: Alerts
    description: Alert subscriptions on products (price drop, back in stock, any price change).
  - name: Notifications
    description: In-app notification inbox.
  - name: Subscription
    description: Plan activation by promo code.
  - name: AdminImports
    description: Catalog, availability and offer imports. Requires role ADMIN.
  - name: AdminUsers
    description: User administration and manual plan grants. Requires role ADMIN.
  - name: AdminPromoCodes
    description: Promo code management. Requires role ADMIN.
  - name: AdminOperations
    description: Detailed health, FX refresh and outbox statistics. Requires role ADMIN.

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Minimal liveness status
      description: |
        Returns only the aggregated status. No dependency names, versions or
        backlog figures are exposed. `DOWN` is returned with status 503. The
        status is the overall status of `GET /admin/health` (`DOWN` when the
        database is down, `DEGRADED` when another component is degraded or
        down), cached for at most 10 seconds.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: The service is up or degraded.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: UP }
        '503':
          description: The service is down.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: DOWN }

  /legal:
    get:
      tags: [System]
      operationId: getLegal
      summary: Privacy notice information
      description: Returns the controller contact rendered on the privacy notice page.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Legal information.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalInfo' }
        '500': { $ref: '#/components/responses/InternalError' }

  /countries:
    get:
      tags: [Reference]
      operationId: listCountries
      summary: List supported countries
      description: Supported countries with currency, reference set, upper-limit set and default locale.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Supported countries.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountryList' }
              example:
                items:
                  - { code: TR, nameEn: Türkiye, currency: TRY, referenceSetCode: EU_NRV, ulSetCode: EFSA, defaultLocale: tr }
                  - { code: DE, nameEn: Germany, currency: EUR, referenceSetCode: EU_NRV, ulSetCode: EFSA, defaultLocale: en }
                  - { code: GB, nameEn: United Kingdom, currency: GBP, referenceSetCode: EU_NRV, ulSetCode: EFSA, defaultLocale: en }
                  - { code: US, nameEn: United States, currency: USD, referenceSetCode: US_DV, ulSetCode: IOM, defaultLocale: en }
        '500': { $ref: '#/components/responses/InternalError' }

  /nutrients:
    get:
      tags: [Reference]
      operationId: listNutrients
      summary: Nutrient registry
      description: |
        Registry with categories, canonical units, the reference sets that
        define a value for each nutrient and the registered forms of each
        nutrient (form registry; `ANY` and `UNKNOWN` are sentinels and are
        never listed).
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Nutrient registry ordered by `sortOrder`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NutrientList' }
              example:
                items:
                  - { code: VIT_C, nameEn: Vitamin C, category: VITAMIN, canonicalUnit: mg, presenceFloorPerDay: null, sortOrder: 20, referenceSetCodes: [EU_NRV, US_DV], forms: [] }
                  - code: VIT_D
                    nameEn: Vitamin D
                    category: VITAMIN
                    canonicalUnit: mcg
                    presenceFloorPerDay: null
                    sortOrder: 30
                    referenceSetCodes: [EU_NRV, US_DV]
                    forms:
                      - { code: D2_ERGOCALCIFEROL, nameEn: Vitamin D2 (ergocalciferol) }
                      - { code: D3_CHOLECALCIFEROL, nameEn: Vitamin D3 (cholecalciferol) }
                  - { code: COQ10, nameEn: Coenzyme Q10, category: COENZYME, canonicalUnit: mg, presenceFloorPerDay: null, sortOrder: 290, referenceSetCodes: [], forms: [] }
        '500': { $ref: '#/components/responses/InternalError' }

  /weights/defaults:
    get:
      tags: [Reference]
      operationId: getDefaultWeights
      summary: Default weights and allowed ranges
      description: |
        Default category weights, the default per-nutrient override and the
        allowed ranges of category weights, overrides and the CUSTOM-mode lambda.

        `engine` carries the read-only scoring-engine parameters the web app
        needs to draw the utility curve and the verdict scale. They are the
        `config` of the scoring service's `GET /internal/v1/health`
        (`EngineConfig` of the scoring contract), copied unrounded. The API
        reads them on its first need and keeps the last successful answer in
        memory; while no answer was ever obtained (scoring service down since
        start-up) `engine` is `null` and the operation still answers 200. This
        operation never answers 503.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Default category weights, override default, the allowed ranges and the engine parameters.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefaultWeights' }
              examples:
                defaults:
                  summary: Engine parameters known
                  value:
                    categories: { VITAMIN: 1.0, MINERAL: 1.0, COENZYME: 0.8, OTHER: 0.5 }
                    categoryRange: { min: 0.0, max: 2.0 }
                    overrideDefault: 1.0
                    overrideRange: { min: 0.0, max: 3.0 }
                    lambdaDefault: 0.5
                    lambdaRange: { min: 0.0, max: 1.0 }
                    engine: { diminishingBeta: 0.35, utilityCeiling: 1.5, verdictWorthItMaxRatio: 1.0, verdictMarginalMaxRatio: 1.5 }
                engineUnknown:
                  summary: Scoring service not reached since start-up
                  value:
                    categories: { VITAMIN: 1.0, MINERAL: 1.0, COENZYME: 0.8, OTHER: 0.5 }
                    categoryRange: { min: 0.0, max: 2.0 }
                    overrideDefault: 1.0
                    overrideRange: { min: 0.0, max: 3.0 }
                    lambdaDefault: 0.5
                    lambdaRange: { min: 0.0, max: 1.0 }
                    engine: null
        '500': { $ref: '#/components/responses/InternalError' }

  /session/quota:
    get:
      tags: [Session]
      operationId: getSessionQuota
      summary: Quota counters of the current principal
      description: |
        For anonymous callers returns the trial counters and creates the `vd_anon`
        cookie when it is missing. A missing or invalid (tampered) cookie
        creates a new identity; creation is limited to 60 per hour per client
        IP (one limit shared with `POST /recommendations/query`), while
        requests with a valid cookie are never limited by it. For
        signed-in users returns the plan usage summary of `GET /me`.

        Problem codes: `unauthorized` (401, invalid bearer token),
        `rate_limited` (429, anonymous identity creation).
      security:
        - {}
        - bearerAuth: []
        - anonCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Quota or usage summary.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Set-Cookie: { $ref: '#/components/headers/SetCookieAnon' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionQuota' }
              examples:
                anonymous:
                  summary: Anonymous principal after one query
                  value: { principal: ANONYMOUS, queriesUsed: 1, queriesLimit: 3, visibleResults: 3 }
                freeUser:
                  summary: FREE user
                  value:
                    principal: USER
                    plan: FREE
                    usage:
                      savedProducts: { used: 2, limit: 5 }
                      alertSubscriptions: { used: 1, limit: 3 }
                      notificationsThisMonth: { used: 4, limit: 30, periodMonth: '2026-11-01' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /recommendations/query:
    post:
      tags: [Recommendations]
      operationId: queryRecommendations
      summary: Ranked recommendations
      description: |
        Scores every in-market product of the country and returns the ranking.
        Products without an offer, and under `IN_STOCK_ONLY` products without
        an in-stock offer, are not scored and are counted in `meta.excluded`.

        - ANONYMOUS: consumes one trial query (3 per anonymous identity); the
          response contains only the top 3 items of the full ranking regardless
          of `page`; `page > 1` returns an empty `items` array with the same
          `meta.visibility`. Locked items are not sent in any form. The `vd_anon`
          cookie is created when missing or invalid; creating it shares the
          limit of `GET /session/quota` (60 identities per hour per client IP).
          The request is validated before the quota is reserved, and only a
          200 response consumes quota: a 422, 500 or 503 after the reservation
          refunds it.
        - USER / ADMIN: unlimited, full paged results; a page beyond the last
          returns an empty `items` array.

        Money is in `meta.currency`. Until a rate exists for the requested
        display currency, money stays native, `meta.fx.status` is `UNAVAILABLE`
        and every item carries the `FX_UNAVAILABLE` flag; a stale rate adds
        `FX_STALE`.

        Scoring-service rejections: a scoring `422` whose errors all point at
        client-supplied values (weights, `ranking.lambda`,
        `requiredNutrients[].minAmountPerDay`), for example
        `value_out_of_range` or `out_of_range`, is returned as 422
        `validation_failed` with the same `errors[].code` and the field
        translated to the public path; any other scoring `422` (for example
        `duplicate_product_id`, inconsistent catalog input) or scoring `4xx`
        is 500 `internal_error`. Scoring timeouts, connection errors, `5xx`
        and an open circuit are 503 `scoring_unavailable`.

        Every number of the request (weights, overrides, `ranking.lambda`,
        `requiredNutrients[].minAmountPerDay`) may have at most 12 integer
        digits and at most 9 decimal places once trailing zeros are removed;
        a number beyond that (for example `1e-1073741824`) is 422
        `validation_failed` with `errors[].code = out_of_range`, before any
        quota is reserved.

        Problem codes: `validation_failed` (422; `errors[].code` includes
        `weights_all_zero`, `unit_requires_form`, `unknown_nutrient_code`,
        `lambda_requires_custom`, `duplicate_nutrient`, `out_of_range`,
        `value_out_of_range`; also a malformed `displayCurrency`),
        `country_not_found` (422), `fx_unsupported_currency` (422),
        `quota_exceeded` (403, anonymous only, with `upgradeHint`),
        `unauthorized` (401, invalid bearer token), `rate_limited` (429 with
        `Retry-After`: anonymous callers 30 queries per day per client IP, or
        anonymous identity creation), `scoring_unavailable` (503), request
        body larger than 64 kB (413), body not `application/json` (415),
        `internal_error` (500).
      security:
        - {}
        - bearerAuth: []
        - anonCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationQueryRequest' }
            example:
              country: TR
              stockFilter: IN_STOCK_ONLY
              ranking: { mode: VALUE }
              weights:
                categories: { VITAMIN: 1.0, MINERAL: 1.0, COENZYME: 0.8, OTHER: 0.5 }
                overrides: { VIT_C: 1.5 }
              requiredNutrients:
                - { code: VIT_C, minAmountPerDay: 300, unit: mg }
              excludeExceedingUl: false
              displayCurrency: USD
              page: 1
              pageSize: 20
      responses:
        '200':
          description: Ranked page of recommendations.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Set-Cookie: { $ref: '#/components/headers/SetCookieAnon' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationQueryResponse' }
              examples:
                goldenPairValueMode:
                  summary: GOLD-A / GOLD-B in TR, VALUE mode, FREE user who saved GOLD-A with a price-drop alert, native currency (fewer than 3 products with content, so `mRef` is null)
                  value:
                    meta:
                      country: TR
                      nativeCurrency: TRY
                      currency: TRY
                      fx: { base: TRY, quote: TRY, rate: 1, asOf: null, source: null, stale: false, status: OK }
                      catalogVersion: 42
                      marketSize: 2
                      mRef: null
                      excluded: { noStock: 0, noOffer: 0, requiredNutrients: 0, exceedsUl: 0 }
                      visibility: { shown: 2, total: 2, locked: 0, reason: null }
                      principal: { type: USER, plan: FREE }
                      page: 1
                      pageSize: 20
                      total: 2
                    items:
                      - productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01
                        code: GOLD-A
                        rank: 1
                        brand: Gold
                        name: Gold A Multivitamin
                        dosageForm: TABLET
                        provenance: &syntheticProvenance { synthetic: true, source: Synthetic fixture set (fictional brand and formulation), sourceRef: null, sourceEntryDate: null }
                        cost: { effectivePrice: 800.0, effectivePriceNative: 800.0, currency: TRY, servingsPerContainer: 60, daysSupply: 60, costPerDay: 13.3333, costPerDayNative: 13.3333, priceStale: false, outOfStock: false }
                        contentScore: 4.9719
                        contentScoreDisplay: 99.2537
                        valueScore: 0.3729
                        valueScoreDisplay: 100.0
                        customScore: null
                        flags: []
                        breakdown:
                          - &mgRow { code: MAGNESIUM, category: MINERAL, amountPerDay: 100, ulAmountPerDay: 100, unit: mg, reference: 375, referenceSource: REGULATORY, coverageRatio: 0.2667, utility: 0.2667, weight: 1.0, contribution: 0.2667, cappedAtUl: false, cappedAtUMax: false, ulBelowReference: true, belowPresenceFloor: false }
                          - &b12Row { code: VIT_B12, category: VITAMIN, amountPerDay: 2.5, ulAmountPerDay: 2.5, unit: mcg, reference: 2.5, referenceSource: REGULATORY, coverageRatio: 1.0, utility: 1.0, weight: 1.0, contribution: 1.0, cappedAtUl: false, cappedAtUMax: false, ulBelowReference: false, belowPresenceFloor: false }
                          - &vitCRowA { code: VIT_C, category: VITAMIN, amountPerDay: 300, ulAmountPerDay: 300, unit: mg, reference: 80, referenceSource: REGULATORY, coverageRatio: 3.75, utility: 1.4626, weight: 1.0, contribution: 1.4626, cappedAtUl: false, cappedAtUMax: false, ulBelowReference: false, belowPresenceFloor: false }
                          - &vitDRow { code: VIT_D, category: VITAMIN, amountPerDay: 10, ulAmountPerDay: 10, unit: mcg, reference: 5, referenceSource: REGULATORY, coverageRatio: 2.0, utility: 1.2426, weight: 1.0, contribution: 1.2426, cappedAtUl: false, cappedAtUMax: false, ulBelowReference: false, belowPresenceFloor: false }
                          - &znRow { code: ZINC, category: MINERAL, amountPerDay: 10, ulAmountPerDay: 10, unit: mg, reference: 10, referenceSource: REGULATORY, coverageRatio: 1.0, utility: 1.0, weight: 1.0, contribution: 1.0, cappedAtUl: false, cappedAtUMax: false, ulBelowReference: false, belowPresenceFloor: false }
                        topContributors: [*vitCRowA, *vitDRow, *b12Row, *znRow, *mgRow]
                        selectedOffer: { retailer: Retailer One, url: 'https://shop.example.com/products/gold-a', checkedAt: '2026-11-20T09:00:00Z' }
                        saved: true
                        alerts:
                          - { id: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d, productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01, countryCode: TR, trigger: PRICE_DROP, thresholdPercent: 10, baselinePrice: 800.0, baselineCurrency: TRY, active: true, createdAt: '2026-11-24T08:30:00Z', lastTriggeredAt: null }
                      - productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e02
                        code: GOLD-B
                        rank: 2
                        brand: Gold
                        name: Gold B Multivitamin
                        dosageForm: TABLET
                        provenance: *syntheticProvenance
                        cost: { effectivePrice: 900.0, effectivePriceNative: 900.0, currency: TRY, servingsPerContainer: 60, daysSupply: 60, costPerDay: 15.0, costPerDayNative: 15.0, priceStale: false, outOfStock: false }
                        contentScore: 5.0093
                        contentScoreDisplay: 100.0
                        valueScore: 0.334
                        valueScoreDisplay: 89.5573
                        customScore: null
                        flags: []
                        breakdown:
                          - *mgRow
                          - *b12Row
                          - &vitCRowB { code: VIT_C, category: VITAMIN, amountPerDay: 350, ulAmountPerDay: 350, unit: mg, reference: 80, referenceSource: REGULATORY, coverageRatio: 4.375, utility: 1.5, weight: 1.0, contribution: 1.5, cappedAtUl: false, cappedAtUMax: true, ulBelowReference: false, belowPresenceFloor: false }
                          - *vitDRow
                          - *znRow
                        topContributors: [*vitCRowB, *vitDRow, *b12Row, *znRow, *mgRow]
                        selectedOffer: { retailer: Retailer One, url: 'https://shop.example.com/products/gold-b', checkedAt: '2026-11-20T09:00:00Z' }
                        saved: false
                        alerts: []
                anonymousSecondPage:
                  summary: Anonymous principal requesting page 2 (locked items are never sent)
                  value:
                    meta:
                      country: TR
                      nativeCurrency: TRY
                      currency: USD
                      fx: { base: TRY, quote: USD, rate: 0.02413700, asOf: '2026-11-23', source: FRANKFURTER, stale: false, status: OK }
                      catalogVersion: 42
                      marketSize: 18
                      mRef: 0.0646
                      excluded: { noStock: 2, noOffer: 1, requiredNutrients: 5, exceedsUl: 0 }
                      visibility: { shown: 3, total: 13, locked: 10, reason: SIGN_UP_REQUIRED }
                      principal: { type: ANONYMOUS, queriesUsed: 1, queriesLimit: 3 }
                      page: 2
                      pageSize: 20
                      total: 13
                    items: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/QuotaExceeded' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ScoringUnavailable' }

  /recommendations/compare:
    post:
      tags: [Recommendations]
      operationId: compareProducts
      summary: Pairwise marginal analysis of two products
      description: |
        Orders the pair so that A is the cheaper product by cost per day (ties:
        lower content score, then lower product id) and returns a verdict on
        whether B is worth its extra cost. `swapped = true` when A is not the
        requested baseline. Allowed for every principal and not counted against
        the anonymous quota; it never creates the `vd_anon` cookie.

        The market used for `mRef` is every scoreable product of the country
        under `stockFilter`, including both products. Both products must be
        in market and have an effective price under `stockFilter`: a product
        without any offer is 422 `validation_failed` with `errors[].code =
        no_offer`, and under `IN_STOCK_ONLY` a product without an in-stock
        offer is `no_stock` (field `baselineProductId` or
        `candidateProductId`). Comparing a product with itself is 422
        `validation_failed` with `errors[].code = same_product` (field
        `candidateProductId`). `mRef`, `marginalRate` and `ratio` are
        nullable (verdict `INSUFFICIENT_DATA` when `mRef` is null).

        Money is in `meta.currency`. Until a rate exists for the requested
        display currency, money stays native, `meta.fx.status` is
        `UNAVAILABLE` and both products carry the `FX_UNAVAILABLE` flag; a
        stale rate adds `FX_STALE`. Scoring-service rejections are mapped as
        for `POST /recommendations/query`.

        Every weight and override may have at most 12 integer digits and at
        most 9 decimal places once trailing zeros are removed; a number beyond
        that (for example `1e-1073741824`) is 422 `validation_failed` with
        `errors[].code = out_of_range`.

        Problem codes: `validation_failed` (422; `errors[].code` includes
        `weights_all_zero`, `same_product`, `no_offer`, `no_stock`,
        `unknown_nutrient_code`, `out_of_range`, `value_out_of_range`),
        `country_not_found` (422), `fx_unsupported_currency` (422),
        `product_not_found` (404), `product_not_available_in_country` (404,
        status `NOT_SOLD` or `DISCONTINUED` or no availability row),
        `unauthorized` (401, invalid bearer token), `rate_limited` (429 with
        `Retry-After`, anonymous callers 120 per minute per client IP, shared
        with `/products/**`), `scoring_unavailable` (503), request body larger
        than 64 kB (413), body not `application/json` (415), `internal_error`
        (500).
      security:
        - {}
        - bearerAuth: []
        - anonCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompareRequest' }
            example:
              country: TR
              baselineProductId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01
              candidateProductId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e02
              stockFilter: IN_STOCK_ONLY
              weights:
                categories: { VITAMIN: 1.0, MINERAL: 1.0, COENZYME: 0.8, OTHER: 0.5 }
              displayCurrency: TRY
      responses:
        '200':
          description: Verdict, deltas and per-nutrient delta rows.
          headers:
