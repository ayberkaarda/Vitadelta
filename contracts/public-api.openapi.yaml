                          - { code: VIT_D, category: VITAMIN, amountPerDay: 10, ulAmountPerDay: 10, unit: mcg, reference: 5, referenceSource: REGULATORY, coverageRatio: 2.0, utility: 1.2426, weight: 1.0, contribution: 1.2426, cappedAtUl: false, cappedAtUMax: false, ulBelowReference: false }
