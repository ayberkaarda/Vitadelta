  /products:
    get:
      tags: [Products]
      operationId: searchProducts
      summary: Search products in one country
      description: |
        Returns in-market (AVAILABLE) products of the country. Products that are
        `NOT_SOLD` or `DISCONTINUED` in the country are never returned. The cost
        object uses the effective price with out-of-stock offers included and is
        `null` when the product has no offer. Results are ordered by `brand`,
        then `name`, then `code` (ascending, binary order); `q` matches a
        case-insensitive substring of brand, name or code. A page beyond the
        last returns an empty `items` array.

        This operation does not call the scoring service (no 503). Flags are
        limited to the ones the API derives itself: `PRICE_STALE`,
        `OUT_OF_STOCK`, `CONVERSION_ASSUMED`, `FX_STALE` and `FX_UNAVAILABLE`.
        Until a rate exists for the requested display currency, money stays
        native, `meta.fx.status` is `UNAVAILABLE` and every item with a cost
        carries `FX_UNAVAILABLE`.

        Problem codes: `validation_failed` (422; malformed `country`,
        `displayCurrency`, `page`, `pageSize` or `q`), `country_not_found`
        (422), `fx_unsupported_currency` (422), `unauthorized` (401, invalid
        bearer token), `rate_limited` (429 with `Retry-After`, anonymous
        callers 120 per minute per client IP, shared with
        `/recommendations/compare`), `internal_error` (500).
      security:
        - {}
        - bearerAuth: []
        - anonCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CountryQueryRequired'
        - name: q
          in: query
          required: false
          description: Free-text search over brand, name and product code (case-insensitive substring). Control characters are rejected with 422.
          schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[^\x00-\x1F\x7F]*$' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/DisplayCurrencyQuery'
      responses:
        '200':
          description: Page of products.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
              examples:
                fxUnavailable:
                  summary: Display currency requested while no rate exists (money stays native)
                  value:
                    meta:
                      country: TR
                      nativeCurrency: TRY
                      currency: TRY
                      fx: { base: TRY, quote: EUR, rate: null, asOf: null, source: null, stale: false, status: UNAVAILABLE }
                      page: 1
                      pageSize: 20
                      total: 1
                    items:
                      - id: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01
                        code: GOLD-A
                        brand: Gold
                        name: Gold A Multivitamin
                        dosageForm: TABLET
                        unitsPerContainer: 60
                        unitsPerServing: 1
                        servingsPerDay: 1
                        provenance: { synthetic: true, source: Synthetic fixture set (fictional brand and formulation), sourceRef: null, sourceEntryDate: null }
                        cost: { effectivePrice: 800.0, effectivePriceNative: 800.0, currency: TRY, servingsPerContainer: 60, daysSupply: 60, costPerDay: 13.3333, costPerDayNative: 13.3333, priceStale: false, outOfStock: false }
                        flags: [{ code: FX_UNAVAILABLE, nutrientCodes: [] }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /products/{id}:
    get:
      tags: [Products]
      operationId: getProduct
      summary: Product detail in one country
      description: |
        Formulation, availability, offers and flags of one product in the given
        country. For signed-in users `saved` and `alerts` reflect the caller's
        saved state and alert subscriptions (active and inactive) in that
        country; for anonymous callers they are `false` and `[]`.

        `offers` lists every offer of the product in the country (in stock
        and out of stock), ordered by `price` ascending, then `checkedAt`
        descending, then `retailer` ascending. `cost` and `selectedOffer` use
        the effective price with out-of-stock offers included. This operation
        does not call the scoring service (no 503); flags are limited to
        `PRICE_STALE`, `OUT_OF_STOCK`, `CONVERSION_ASSUMED`, `FX_STALE` and
        `FX_UNAVAILABLE`. Until a rate exists for the requested display
        currency, money stays native and `meta.fx.status` is `UNAVAILABLE`.

        Problem codes: `product_not_found` (404, unknown id or an id that is
        not a UUID),
        `product_not_available_in_country` (404, status `NOT_SOLD` or
        `DISCONTINUED` or no availability row), `validation_failed` (422;
        malformed `country` or `displayCurrency`), `country_not_found` (422),
        `fx_unsupported_currency` (422), `unauthorized` (401, invalid bearer
        token), `rate_limited` (429 with `Retry-After`, anonymous callers 120
        per minute per client IP), `internal_error` (500).
      security:
        - {}
        - bearerAuth: []
        - anonCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/ProductIdPath'
        - $ref: '#/components/parameters/CountryQueryRequired'
        - $ref: '#/components/parameters/DisplayCurrencyQuery'
      responses:
        '200':
          description: Product detail.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /plans:
    get:
      tags: [Plans]
      operationId: listPlans
      summary: Plan limits and prices
      description: |
        Returns the FREE and PRO plans. A `null` limit means unlimited. Prices are
        converted to the display currency; the native currency of a price is the
        currency stored on the plan. Credentials are optional: a valid bearer
        token only supplies the user's display-currency preference. When no
        rate exists for the requested supported currency, money stays in the
        native currency, `meta.currency` equals `meta.nativeCurrency`,
        `meta.fx.quote` names the requested currency and `meta.fx.status` is
        `UNAVAILABLE`.

        Problem codes: `unauthorized` (401, invalid bearer token),
        `validation_failed` (422, `displayCurrency` not three upper-case
        letters), `fx_unsupported_currency` (422).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/DisplayCurrencyQuery'
      responses:
        '200':
          description: Plans.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanList' }
              examples:
                native:
                  summary: Native currency
                  value:
                    meta:
                      nativeCurrency: TRY
                      currency: TRY
                      fx: { base: TRY, quote: TRY, rate: 1, asOf: null, source: null, stale: false, status: OK }
                    items:
                      - { code: FREE, name: Free, savedProductsLimit: 5, alertSubscriptionsLimit: 3, notificationsPerMonthLimit: 30, price: null }
                      - code: PRO
                        name: Pro
                        savedProductsLimit: null
                        alertSubscriptionsLimit: null
                        notificationsPerMonthLimit: null
                        price: { amount: 199.0, amountNative: 199.0, currency: TRY, nativeCurrency: TRY, billingPeriod: MONTHLY }
                fxUnavailable:
                  summary: Display currency requested while no rate exists
                  value:
                    meta:
                      nativeCurrency: TRY
                      currency: TRY
                      fx: { base: TRY, quote: EUR, rate: null, asOf: null, source: null, stale: false, status: UNAVAILABLE }
                    items:
                      - { code: FREE, name: Free, savedProductsLimit: 5, alertSubscriptionsLimit: 3, notificationsPerMonthLimit: 30, price: null }
                      - code: PRO
                        name: Pro
                        savedProductsLimit: null
                        alertSubscriptionsLimit: null
                        notificationsPerMonthLimit: null
                        price: { amount: 199.0, amountNative: 199.0, currency: TRY, nativeCurrency: TRY, billingPeriod: MONTHLY }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /fx/currencies:
    get:
      tags: [FX]
      operationId: listFxCurrencies
      summary: Supported display currencies
      description: |
        The supported display currencies (country currencies plus the
        configured extra ISO 4217 codes of `VITADELTA_FX_EXTRA_CURRENCIES`),
        ordered by `code` ascending. `asOf` is the newest stored `as_of` of
        any rate row whose base or quote is the currency (`null` when no such
        row exists); `stale` is `true` when `asOf` is more than 5 days before
        the current UTC date, and `false` when `asOf` is `null`. Reads the
        stored rates only; it never calls the FX provider.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Supported currencies.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxCurrencyList' }
              examples:
                refreshed:
                  summary: Rates stored for every currency
                  value:
                    items:
                      - { code: EUR, asOf: '2026-11-23', stale: false }
                      - { code: GBP, asOf: '2026-11-23', stale: false }
                      - { code: TRY, asOf: '2026-11-23', stale: false }
                      - { code: USD, asOf: '2026-11-23', stale: false }
                beforeFirstRefresh:
                  summary: No rate stored yet
                  value:
                    items:
                      - { code: EUR, asOf: null, stale: false }
                      - { code: GBP, asOf: null, stale: false }
                      - { code: TRY, asOf: null, stale: false }
                      - { code: USD, asOf: null, stale: false }
        '500': { $ref: '#/components/responses/InternalError' }

  /fx/rates:
    get:
      tags: [FX]
      operationId: getFxRates
      summary: Newest rates for a base currency
      description: |
        Newest stored rate (largest `as_of`) per quote currency for the base,
        over every other supported currency, ordered by `quote` ascending. A
        quote without any stored row for the pair is omitted (an empty
        `rates` array before the first refresh); the identity pair is never
        listed. Rates are never inverted or derived through a third currency.
        `rate` is a JSON number written with exactly the 8 stored decimals
        (for example `0.02087500`), never rounded. `stale` is `true` when
        `asOf` is more than 5 days before the current UTC date. `source` is
        `FRANKFURTER`. Reads the stored rates only.

        Problem codes: `validation_failed` (422, missing or malformed `base`,
        field `base`), `fx_unsupported_currency` (422, a well-formed base
        outside the supported set), `internal_error` (500).
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: base
          in: query
          required: true
          description: Base currency (ISO 4217).
          schema: { $ref: '#/components/schemas/CurrencyCode' }
          example: TRY
      responses:
        '200':
          description: Rates.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxRateList' }
              examples:
                tryBase:
                  summary: Base TRY (illustrative rates)
                  value:
                    base: TRY
                    rates:
                      - { quote: EUR, rate: 0.01807000, asOf: '2026-11-23', source: FRANKFURTER, stale: false }
                      - { quote: GBP, rate: 0.01588000, asOf: '2026-11-23', source: FRANKFURTER, stale: false }
                      - { quote: USD, rate: 0.02413700, asOf: '2026-11-23', source: FRANKFURTER, stale: false }
                beforeFirstRefresh:
                  summary: No rate stored yet
                  value: { base: TRY, rates: [] }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register with e-mail and password
      description: |
        Enumeration-safe: always responds 202 with the same body and headers. A
        new e-mail creates a USER with an ACTIVE FREE subscription and queues the
        verification e-mail; an existing e-mail queues an "already registered"
        e-mail instead. A present `vd_anon` identity is converted and the cookie
        is cleared on both paths. Requires `Content-Type: application/json` and,
        when an `Origin` header is present, an allowed origin.

        Problem codes: `validation_failed` (422; password shorter than 10
        characters or in the breached-password list, malformed e-mail),
        `country_not_found` (422), `forbidden` (403, content type or origin
        rejected), `rate_limited` (429, 5 per hour per IP).
      security:
        - {}
        - anonCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example: { email: user@example.com, password: correct-horse-battery, locale: en, countryCode: TR }
      responses:
        '202':
          description: Accepted; a message has been queued for the address.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Set-Cookie: { $ref: '#/components/headers/SetCookieClearAnon' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedMessage' }
              example: { messageKey: auth.register.check_email }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verify the e-mail address
      description: |
        Consumes a single-use `VERIFY_EMAIL` token (valid 24 hours) taken from the
        URL fragment of the verification link.

        Problem codes: `token_invalid` (400), `token_expired` (400),
        `validation_failed` (422), `rate_limited` (429, 10 per hour per IP).
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204':
          description: E-mail verified.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '400': { $ref: '#/components/responses/TokenRejected' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Resend the verification e-mail
      description: |
        Always 202. Issuing a new `VERIFY_EMAIL` token invalidates all older ones.
        Suppressed or dropped e-mails still return 202.

        Problem codes: `validation_failed` (422), `rate_limited` (429, 5 per hour
        per IP).
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202':
          description: Accepted.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedMessage' }
              example: { messageKey: auth.verify.resent }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in
      description: |
        Returns a 15-minute access token and sets the `vd_refresh` cookie.
        Unverified users can log in and see `emailVerified = false`. Requires
        `Content-Type: application/json` and, when an `Origin` header is
        present, an allowed origin.

        Problem codes: `invalid_credentials` (401, identical for unknown e-mail
        and wrong password), `account_disabled` (403, only after a correct
        password), `forbidden` (403, content type or origin rejected),
        `validation_failed` (422), `rate_limited` (429, 10 per minute per IP, or
        account back-off after 10 failures in 15 minutes).
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Set-Cookie: { $ref: '#/components/headers/SetCookieRefresh' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenResponse' }
              example:
                accessToken: eyJraWQiOiI0ZjFhMmIzYzRkNWU2ZjcwIiwiYWxnIjoiSFMyNTYifQ.eyJzdWIiOiI5ZjFjMmQzZSJ9.c2lnbmF0dXJl
                tokenType: Bearer
                expiresIn: 900
                user:
                  id: 9f1c2d3e-4b5a-4c6d-8e7f-0a1b2c3d4e5f
                  email: user@example.com
                  emailVerified: true
                  role: USER
                  status: ACTIVE
                  locale: en
                  defaultCountryCode: TR
                  displayCurrency: null
                  emailAlertsEnabled: true
                  createdAt: '2026-11-01T10:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate the refresh token
      description: |
        Rotates the `vd_refresh` cookie and returns a fresh access token. A token
        rotated less than 20 seconds ago returns the same successor (grace
        window). Presenting a revoked token outside the grace window revokes the
        whole token family. Re-reads the account status. Requires
        `X-Requested-With: vitadelta`, `Content-Type: application/json` and, when
        an `Origin` header is present, an allowed origin.

        Problem codes: `unauthorized` (401, missing, unknown or expired refresh
        token), `refresh_reuse_detected` (401), `account_disabled` (403),
        `forbidden` (403, CSRF header, content type or origin rejected),
        `rate_limited` (429, 60 per minute per IP).
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: false
        description: No fields are read; an empty JSON object may be sent to satisfy the content-type rule.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyObject' }
      responses:
        '200':
          description: Session refreshed.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Set-Cookie: { $ref: '#/components/headers/SetCookieRefresh' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out
      description: |
        Revokes the refresh-token family of the presented cookie and clears the
        cookie. Idempotent: responds 204 also when no valid cookie is present.
        Requires `X-Requested-With: vitadelta`, `Content-Type: application/json`
        and, when an `Origin` header is present, an allowed origin.

        Problem codes: `forbidden` (403, CSRF header, content type or origin
        rejected).
      security:
        - refreshCookie: []
        - {}
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: false
        description: No fields are read; an empty JSON object may be sent to satisfy the content-type rule.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyObject' }
      responses:
        '204':
          description: Logged out.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Set-Cookie: { $ref: '#/components/headers/SetCookieClearRefresh' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset e-mail
      description: |
        Always 202. When the account exists, a `RESET_PASSWORD` token (valid one
        hour) is created, older unused reset tokens are invalidated and the
        e-mail is queued.

        Problem codes: `validation_failed` (422), `rate_limited` (429, 5 per hour
        per IP).
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202':
          description: Accepted.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedMessage' }
              example: { messageKey: auth.forgot.check_email }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: |
        Consumes a single-use `RESET_PASSWORD` token. On success every outstanding
        reset token of the user is invalidated and all refresh-token families
        are revoked.

        Problem codes: `token_invalid` (400), `token_expired` (400),
        `validation_failed` (422, password rules), `rate_limited` (429, 10 per
        hour per IP).
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204':
          description: Password changed.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '400': { $ref: '#/components/responses/TokenRejected' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Profile, plan, subscription and usage meters
      description: |
        Problem codes: `unauthorized` (401).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Profile of the signed-in user.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                id: 9f1c2d3e-4b5a-4c6d-8e7f-0a1b2c3d4e5f
                email: user@example.com
                emailVerified: true
                role: USER
                status: ACTIVE
                locale: tr
                defaultCountryCode: TR
                displayCurrency: TRY
                emailAlertsEnabled: true
                createdAt: '2026-11-01T10:00:00Z'
                plan: { code: FREE, name: Free, savedProductsLimit: 5, alertSubscriptionsLimit: 3, notificationsPerMonthLimit: 30 }
                subscription: { id: 1d2e3f4a-5b6c-4d7e-8f9a-0b1c2d3e4f5a, planCode: FREE, status: ACTIVE, source: MANUAL, startedAt: '2026-11-01T10:00:00Z', currentPeriodEnd: null, canceledAt: null }
                usage:
                  savedProducts: { used: 2, limit: 5 }
                  alertSubscriptions: { used: 1, limit: 3 }
                  notificationsThisMonth: { used: 4, limit: 30, periodMonth: '2026-11-01' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Account]
      operationId: updateMe
      summary: Update profile settings
      description: |
        Updates any of `displayCurrency`, `locale`, `defaultCountryCode` and
        `emailAlertsEnabled`. `displayCurrency: null` resets the preference to
        the country's native currency.

        `emailAlertsEnabled: false` stops alert and cap e-mails only: in-app
        notifications are still created, and a pending e-mail is evaluated at
        send time (it is skipped as ineligible while the preference is
        `false`). Auth and plan e-mails are not affected. It is the target of
        the preference link and the `List-Unsubscribe` header of alert
        e-mails.

        Problem codes: `unauthorized` (401), `validation_failed` (422),
        `country_not_found` (422), `fx_unsupported_currency` (422).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
            example: { displayCurrency: EUR, emailAlertsEnabled: false }
      responses:
        '200':
          description: Updated profile.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Account]
      operationId: deleteMe
      summary: Delete the account
      description: |
        Re-checks the password and hard-deletes the account with all dependent
        data (refresh tokens, e-mail tokens, subscriptions, promo redemptions,
        saved products, alert subscriptions, notifications, usage counters).
        The `vd_refresh` cookie is cleared.

        Problem codes: `unauthorized` (401, missing or invalid access token),
        `invalid_credentials` (401, wrong password), `validation_failed` (422).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204':
          description: Account deleted.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Set-Cookie: { $ref: '#/components/headers/SetCookieClearRefresh' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/saved-products:
    get:
      tags: [SavedProducts]
      operationId: listSavedProducts
      summary: Saved products in one country
      description: |
        Every saved product of the caller for the country (no paging), ordered
        by `savedAt` descending, then `productId` ascending, with the current
        effective price (section 7.4, out-of-stock offers included), its stock
        state (`cost.outOfStock` and the `OUT_OF_STOCK` flag), flags and the
        caller's active alert subscriptions on the product in that country.
        Does not call the scoring service.

        A product whose availability in the country is no longer `AVAILABLE`
        (`NOT_SOLD`, `DISCONTINUED` or no availability row) stays in the list
        with `availabilityStatus` (`NOT_SOLD` for a missing row), `cost` and
        `selectedOffer` `null` and the single flag `UNAVAILABLE_IN_COUNTRY`.
        An available product carries the flags of `GET /products`
        (`CONVERSION_ASSUMED`, `PRICE_STALE`, `OUT_OF_STOCK`, then `FX_STALE`
        / `FX_UNAVAILABLE` when it has a cost); an available product without
        any offer has `cost` and `selectedOffer` `null`.

        Money is converted like every catalog response (`meta.fx`); until a
        rate exists for the display currency money stays native with
        `meta.fx.status = UNAVAILABLE`. `alerts[].baselinePrice` is always
        native (`baselineCurrency`).

        Problem codes: `unauthorized` (401), `validation_failed` (422,
        malformed `country` or `displayCurrency`), `country_not_found` (422),
        `fx_unsupported_currency` (422).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CountryQueryRequired'
        - $ref: '#/components/parameters/DisplayCurrencyQuery'
      responses:
        '200':
          description: Saved products.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedProductList' }
              example:
                meta:
                  country: TR
                  nativeCurrency: TRY
                  currency: USD
                  fx: { base: TRY, quote: USD, rate: 0.02413700, asOf: '2026-11-23', source: FRANKFURTER, stale: false, status: OK }
                items:
                  - productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01
                    code: GOLD-A
                    brand: Gold
                    name: Gold A Multivitamin
                    dosageForm: TABLET
                    provenance: { synthetic: true, source: Synthetic fixture set (fictional brand and formulation), sourceRef: null, sourceEntryDate: null }
                    countryCode: TR
                    savedAt: '2026-11-24T08:30:00Z'
                    availabilityStatus: AVAILABLE
                    cost: { effectivePrice: 19.3096, effectivePriceNative: 800.0, currency: USD, servingsPerContainer: 60, daysSupply: 60, costPerDay: 0.3218, costPerDayNative: 13.3333, priceStale: false, outOfStock: false }
                    selectedOffer: { retailer: Retailer One, url: 'https://shop.example.com/products/gold-a', checkedAt: '2026-11-20T09:00:00Z' }
                    flags: []
                    alerts:
                      - { id: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d, productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01, countryCode: TR, trigger: PRICE_DROP, thresholdPercent: 10, baselinePrice: 800.0, baselineCurrency: TRY, active: true, createdAt: '2026-11-24T08:30:00Z', lastTriggeredAt: null }
                  - productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e07
                    code: GOLD-G
                    brand: Gold
                    name: Gold G Multivitamin
                    dosageForm: CAPSULE
                    provenance: { synthetic: true, source: Synthetic fixture set (fictional brand and formulation), sourceRef: null, sourceEntryDate: null }
                    countryCode: TR
                    savedAt: '2026-11-20T10:00:00Z'
                    availabilityStatus: DISCONTINUED
                    cost: null
                    selectedOffer: null
                    flags: [{ code: UNAVAILABLE_IN_COUNTRY, nutrientCodes: [] }]
                    alerts: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [SavedProducts]
      operationId: saveProduct
      summary: Save a product
      description: |
        Saves the product for the country. Does not require a verified e-mail.

        Order of checks: body validation (422) -> country (422
        `country_not_found`) -> product (404 `product_not_found`, also for an
        unknown id) -> availability (404 `product_not_available_in_country`
        unless the product is `AVAILABLE` in the country) -> in one
        transaction: lock the user's row, return 200 with the existing row
        when it is already saved (idempotent, no limit check, `savedAt`
        unchanged), otherwise check the plan limit and insert (201).

        The saved-product limit counts the caller's saved rows over every
        country. At the limit the answer is 403 `entitlement_exceeded` with
        `limit`, `used`, `plan`, `upgradeTo: PRO` and `upgradeHint
        { messageKey: limits.saved_products_reached, ctaPath: /upgrade }`.

        Problem codes: `unauthorized` (401), `entitlement_exceeded` (403, saved
        product limit of the plan reached), `product_not_found` (404),
        `product_not_available_in_country` (404), `validation_failed` (422,
        missing or malformed `productId` or `countryCode`),
        `country_not_found` (422), request body larger than 64 kB (413), body
        not `application/json` (415), `internal_error` (500).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveProductRequest' }
            example: { productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01, countryCode: TR }
      responses:
        '200':
          description: Already saved; the existing row is returned unchanged.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedProductRef' }
              example: { productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01, countryCode: TR, savedAt: '2026-11-20T10:00:00Z' }
        '201':
          description: Saved.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedProductRef' }
              example: { productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01, countryCode: TR, savedAt: '2026-11-24T08:30:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EntitlementForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/saved-products/{productId}:
    delete:
      tags: [SavedProducts]
      operationId: removeSavedProduct
      summary: Remove a saved product
      description: |
        Removes the caller's saved-product row for the product and country and,
        in the same transaction, sets `active = false` on every alert
        subscription of the caller for that product and country (the
        subscriptions are kept, with their baseline, and stop counting toward
        the active-alert limit). Idempotent: responds 204 also when the
        product was not saved, does not exist, or `productId` is not a UUID.

        Problem codes: `unauthorized` (401), `validation_failed` (422,
        missing or malformed `country`), `country_not_found` (422).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: productId
          in: path
          required: true
          description: Product id.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CountryQueryRequired'
      responses:
        '204':
          description: Removed.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/alerts:
    get:
      tags: [Alerts]
      operationId: listAlerts
      summary: Alert subscriptions of the caller
      description: |
        All alert subscriptions of the caller, active and inactive, across
        countries (no paging), ordered by `createdAt` descending, then `id`
        ascending. `baselinePrice` is in the country's native currency
        (`baselineCurrency`) and is never converted. `product` names the
        product and its availability in the subscription's country; anything
        but `AVAILABLE` (a missing availability row is `NOT_SOLD`) is shown
        with the `UNAVAILABLE_IN_COUNTRY` badge.

        Problem codes: `unauthorized` (401), `internal_error` (500).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Alert subscriptions.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertList' }
              example:
                items:
                  - id: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
                    productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01
                    countryCode: TR
                    trigger: PRICE_DROP
                    thresholdPercent: 10
                    baselinePrice: 800.0
                    baselineCurrency: TRY
                    active: true
                    createdAt: '2026-11-24T08:30:00Z'
                    lastTriggeredAt: null
                    product: { id: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01, code: GOLD-A, brand: Gold, name: Gold A Multivitamin, availabilityStatus: AVAILABLE, provenance: { synthetic: true, source: Synthetic fixture set (fictional brand and formulation), sourceRef: null, sourceEntryDate: null } }
                  - id: 6b7c8d9e-0f1a-4b2c-9d3e-4f5a6b7c8d9e
                    productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e02
                    countryCode: TR
                    trigger: BACK_IN_STOCK
                    thresholdPercent: null
                    baselinePrice: null
                    baselineCurrency: TRY
                    active: false
                    createdAt: '2026-11-21T12:00:00Z'
                    lastTriggeredAt: '2026-11-22T07:00:00Z'
                    product: { id: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e02, code: GOLD-B, brand: Gold, name: Gold B Multivitamin, availabilityStatus: AVAILABLE, provenance: { synthetic: true, source: Synthetic fixture set (fictional brand and formulation), sourceRef: null, sourceEntryDate: null } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Alerts]
      operationId: createAlert
      summary: Subscribe to an alert
      description: |
        Creates an active subscription. A saved-product row is created implicitly
        when missing and counts toward the saved-product limit. `thresholdPercent`
        applies to `PRICE_DROP` only (default 5.00 when absent or `null`); for
        `BACK_IN_STOCK` and `PRICE_CHANGE` a non-null value is 422
        `validation_failed` with `errors[].code = threshold_not_allowed`
        (field `thresholdPercent`). Requires a verified e-mail.

        `baselinePrice` (`PRICE_DROP` only) is the product's current native
        effective price (section 7.4, out-of-stock offers included); `null`
        when no offer exists, in which case the alert evaluator stores the
        first price it sees and does not fire on that event. Other triggers
        store no baseline (`null`).

        Uniqueness: one subscription per (caller, product, country, trigger).
        When it already exists the answer is 200 with the existing
        subscription unchanged, active or not: the threshold, baseline and
        `active` are not modified and no limit or verification check runs.
        Use `PATCH /me/alerts/{id}` to change the threshold or to reactivate.
        Requests of one user are serialized by the row lock, so two parallel
        identical requests give one 201 and one 200.

        Order of checks: body validation (422) -> country (422
        `country_not_found`) -> product (404 `product_not_found`, also for an
        unknown id) -> availability (404 `product_not_available_in_country`
        unless `AVAILABLE`) -> in one transaction: lock the user's row,
        existing subscription (200), e-mail verification (403
        `email_not_verified`), active-alert limit (403 `entitlement_exceeded`,
        `upgradeHint.messageKey = limits.alert_subscriptions_reached`),
        saved-product limit when the implicit saved row is missing (403
        `entitlement_exceeded`, `limits.saved_products_reached`), insert
        (201). A failed check writes nothing.

        Problem codes: `unauthorized` (401), `email_not_verified` (403),
        `entitlement_exceeded` (403, alert or saved-product limit reached),
        `product_not_found` (404), `product_not_available_in_country` (404),
        `validation_failed` (422; `errors[].code` includes
        `threshold_not_allowed`, `out_of_range`), `country_not_found` (422),
        request body larger than 64 kB (413), body not `application/json`
        (415), `internal_error` (500).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAlertRequest' }
            example: { productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01, countryCode: TR, trigger: PRICE_DROP, thresholdPercent: 10 }
      responses:
        '200':
          description: The subscription already existed; returned unchanged.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSubscription' }
              example:
                id: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
                productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01
                countryCode: TR
                trigger: PRICE_DROP
                thresholdPercent: 10
                baselinePrice: 800.0
                baselineCurrency: TRY
                active: false
                createdAt: '2026-11-20T10:00:00Z'
                lastTriggeredAt: null
        '201':
          description: Subscription created.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSubscription' }
              example:
                id: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
                productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01
                countryCode: TR
                trigger: PRICE_DROP
                thresholdPercent: 10
                baselinePrice: 800.0
                baselineCurrency: TRY
                active: true
                createdAt: '2026-11-24T08:30:00Z'
                lastTriggeredAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EntitlementForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/alerts/{id}:
    patch:
      tags: [Alerts]
      operationId: updateAlert
      summary: Activate, deactivate or change the threshold
      description: |
        Applies `active` and/or `thresholdPercent` in one transaction that
        first locks the caller's row. An id that does not exist, belongs to
        another user or is not a UUID returns the same 404 (`about:blank`,
        identical body apart from `instance` and `requestId`).

        - `active: true` on an inactive subscription (activation): 404
          `product_not_available_in_country` unless the product is still
          `AVAILABLE` in the country, then 403 `email_not_verified`, then the
          active-alert limit (403 `entitlement_exceeded`), then, when the
          saved-product row for the product and country is missing (it was
          removed), the saved-product limit (403 `entitlement_exceeded`) and
          the implicit saved row is re-created. The baseline is reset.
        - `active: true` on an active or `active: false` on an inactive
          subscription changes nothing and runs no check. `active: false`
          on an active subscription deactivates it without any check.
        - `thresholdPercent` (`PRICE_DROP` only; on another trigger 422
          `validation_failed`, `threshold_not_allowed`; `null` is 422
          `validation_failed`): a value different from the stored one is
          stored and resets the baseline; the same value changes nothing.
        - Baseline reset (`PRICE_DROP` only) = the product's current native
          effective price (section 7.4, out-of-stock offers included), `null`
          when no offer exists.

        Order of checks: body shape (422: empty object, `null` or out-of-range
        `thresholdPercent`, wrong types) -> subscription lookup (404) ->
        trigger-dependent check (422 `threshold_not_allowed`) -> activation
        checks above. A failed check writes nothing.

        Problem codes: `unauthorized` (401), `email_not_verified` (403),
        `entitlement_exceeded` (403), 404 (`about:blank`),
        `product_not_available_in_country` (404, activation only),
        `validation_failed` (422; `threshold_not_allowed`, `out_of_range`,
        an empty body), request body larger than 64 kB (413), body not
        `application/json` (415), `internal_error` (500).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/AlertIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAlertRequest' }
            examples:
              deactivate:
                summary: Deactivate
                value: { active: false }
              changeThreshold:
                summary: Change the threshold (resets the baseline)
                value: { thresholdPercent: 7.5 }
      responses:
        '200':
          description: The subscription after the update (also when nothing changed).
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSubscription' }
              example:
                id: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
                productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01
                countryCode: TR
                trigger: PRICE_DROP
                thresholdPercent: 7.5
                baselinePrice: 760.0
                baselineCurrency: TRY
                active: true
                createdAt: '2026-11-24T08:30:00Z'
                lastTriggeredAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EntitlementForbidden' }
        '404':
          description: |
            Unknown, foreign or non-UUID subscription id (`about:blank`), or on
            activation `product_not_available_in_country`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Not Found.
                instance: /api/v1/me/alerts/5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
                requestId: 8c1d2e3f-4a5b-4c6d-9e7f-0a1b2c3d4e5f
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Alerts]
      operationId: deleteAlert
      summary: Delete an alert subscription
      description: |
        Deletes the subscription (its `alert_delivery` rows go with it;
        notifications already created stay in the inbox). The saved-product
        row is kept. An id that does not exist, belongs to another user or is
        not a UUID returns the same 404 (`about:blank`); deleting twice is 404
        the second time.

        Problem codes: `unauthorized` (401), 404 (`about:blank`),
        `internal_error` (500).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/AlertIdPath'
      responses:
        '204':
          description: Deleted.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Notification inbox
      description: |
        Notifications of the caller ordered by `createdAt` descending, then
        `id` descending, paged with `page` / `pageSize`. With
        `unreadOnly=true` only notifications with `readAt = null` are listed
        and `meta.total` counts only those. A page beyond the last returns an
        empty `items` array. In-app notifications exist regardless of the
        e-mail preference and of e-mail delivery.

        `type` selects the payload: alert notifications carry a snapshot of
        the product (code, brand, name), the country, the native `currency`
        and the before / after effective price and stock state; money in a
        payload is always native and never converted (no `meta.fx` here).

        Problem codes: `unauthorized` (401), `validation_failed` (422,
        `unreadOnly` not `true`/`false`, `page < 1`, `pageSize` outside 1 to
        100), `internal_error` (500).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: unreadOnly
          in: query
          required: false
          description: Return only unread notifications.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of notifications.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
              example:
                meta: { page: 1, pageSize: 20, total: 5 }
                items:
                  - id: 7d8e9f0a-1b2c-4d3e-9f4a-5b6c7d8e9f0a
                    type: ALERT_PRICE_DROP
                    payload:
                      subscriptionId: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
                      trigger: PRICE_DROP
                      productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01
                      productCode: GOLD-A
                      brand: Gold
                      productName: Gold A Multivitamin
                      countryCode: TR
                      currency: TRY
                      thresholdPercent: 5
                      baselinePrice: 800.0
                      before: { effectivePrice: 800.0, inStock: true, retailer: Retailer One, url: 'https://shop.example.com/products/gold-a' }
                      after: { effectivePrice: 752.0, inStock: true, retailer: Retailer One, url: 'https://shop.example.com/products/gold-a' }
                    createdAt: '2026-11-24T07:00:00Z'
                    readAt: null
                  - id: 8e9f0a1b-2c3d-4e4f-8a5b-6c7d8e9f0a1b
                    type: ALERT_BACK_IN_STOCK
                    payload:
                      subscriptionId: 6b7c8d9e-0f1a-4b2c-9d3e-4f5a6b7c8d9e
                      trigger: BACK_IN_STOCK
                      productId: 3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e02
                      productCode: GOLD-B
                      brand: Gold
                      productName: Gold B Multivitamin
                      countryCode: TR
                      currency: TRY
                      thresholdPercent: null
                      baselinePrice: null
                      before: { effectivePrice: 900.0, inStock: false, retailer: Retailer One, url: 'https://shop.example.com/products/gold-b' }
                      after: { effectivePrice: 900.0, inStock: true, retailer: Retailer One, url: 'https://shop.example.com/products/gold-b' }
                    createdAt: '2026-11-22T07:00:00Z'
                    readAt: '2026-11-22T09:00:00Z'
                  - id: 9f0a1b2c-3d4e-4f5a-9b6c-7d8e9f0a1b2c
                    type: NOTIFICATION_CAP_REACHED
                    payload: { periodMonth: '2026-10-01', limit: 30 }
                    createdAt: '2026-10-28T07:00:00Z'
                    readAt: '2026-10-28T08:00:00Z'
                  - id: 0a1b2c3d-4e5f-4a6b-8c7d-8e9f0a1b2c3d
                    type: PLAN_EXPIRED
                    payload: { expiredPlanCode: PRO, planCode: FREE, deactivatedAlertSubscriptions: 2 }
                    createdAt: '2026-10-01T00:05:00Z'
                    readAt: '2026-10-01T10:00:00Z'
                  - id: 1b2c3d4e-5f6a-4b7c-9d8e-9f0a1b2c3d4e
                    type: PLAN_ACTIVATED
                    payload: { planCode: PRO, source: PROMO, currentPeriodEnd: '2026-10-01T00:00:00Z', extended: false }
                    createdAt: '2026-09-01T00:00:00Z'
                    readAt: '2026-09-01T00:10:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/notifications/{id}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one notification as read
      description: |
        Sets `readAt` to now when it is `null`; an already read notification
        keeps its first `readAt` (idempotent, 204). An id that does not exist,
        belongs to another user or is not a UUID returns the same 404
        (`about:blank`). No request body.

        Problem codes: `unauthorized` (401), 404 (`about:blank`),
        `internal_error` (500).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/NotificationIdPath'
      responses:
        '204':
          description: Marked as read.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark all notifications as read
      description: |
        Sets `readAt` to now on every notification of the caller whose
        `readAt` is `null` (one statement); already read notifications keep
        their `readAt`. Always 204, also when nothing was unread. No request
        body.

        Problem codes: `unauthorized` (401), `internal_error` (500).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '204':
          description: All notifications marked as read.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: getUnreadNotificationCount
      summary: Number of unread notifications
      description: |
        Number of the caller's notifications with `readAt = null` (equals
        `meta.total` of `GET /me/notifications?unreadOnly=true`). Polled by
        the web app every 60 seconds while signed in.

        Problem codes: `unauthorized` (401), `internal_error` (500).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Unread count.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadCount' }
              example: { unreadCount: 3 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/subscription/promo:
    post:
      tags: [Subscription]
      operationId: redeemPromoCode
      summary: Activate or extend PRO with a promo code
      description: |
        Code lookup is case-insensitive. Activating PRO cancels the current
        subscription and starts an ACTIVE PRO subscription for the code's
        duration; an existing PRO period is extended. Every failure (unknown,
        expired, exhausted, already redeemed by this user, or a value that is
        not a well-formed code) returns the same 400 `promo_invalid` and counts
        against both rate limits.

        Problem codes: `unauthorized` (401), `email_not_verified` (403),
        `promo_invalid` (400), `conflict_retry` (409), `validation_failed`
        (422, only for a missing or null `code` or a body that cannot be read
        as this request), `rate_limited` (429, 10 per hour per IP and 5 per hour per user).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoRedeemRequest' }
            example: { code: LAUNCH-7K3M9QXT2B4N6PRW }
      responses:
        '200':
          description: PRO activated or extended.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionActivation' }
              example:
                plan: PRO
                subscription: { id: 4e5f6a7b-8c9d-4e0f-9a1b-2c3d4e5f6a7b, planCode: PRO, status: ACTIVE, source: PROMO, startedAt: '2026-11-24T08:30:00Z', currentPeriodEnd: '2026-12-24T08:30:00Z', canceledAt: null }
        '400': { $ref: '#/components/responses/PromoInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/health:
    get:
      tags: [AdminOperations]
      operationId: getAdminHealth
      summary: Detailed dependency status
      description: |
        Requires role ADMIN. Scoring service, database, FX freshness, outbox
        backlog and dead letters, and the last run of each scheduled job.
        Always answers 200 with the body (also when a component is `DOWN`);
        it is evaluated on each call and never cached.

        - `scoring`: `UP` when `GET /internal/v1/health` answers 200 within
          the scoring client's timeouts, else `DOWN` (an open circuit is
          `DOWN` without a call).
        - `database`: `UP` when a trivial query succeeds, else `DOWN`.
        - `fx`: `newestAsOf` = newest `as_of` over all stored rates (`null`
          when none), `rateAgeDays` = current UTC date minus `newestAsOf` in
          days, `stale = rateAgeDays > 5`; `status` is `UP` when not stale,
          `DEGRADED` when stale or no rate is stored, never `DOWN`.
        - `outbox`: the counts of `GET /admin/outbox/stats`; `status` is
          `DEGRADED` when `failed > 0` or the oldest pending event is older
          than 5 minutes (`oldestPendingAt`), else `UP`. Dead letters are
          reported but do not change the status.
        - Overall `status`: `DOWN` when `database` is `DOWN`; otherwise
          `DEGRADED` when any component is not `UP`; otherwise `UP`. The
          public `GET /health` returns this same overall status (and 503 for
          `DOWN`) without any detail, from a result cached for at most 10
          seconds so that public polling cannot multiply calls to the
          scoring service or the database.
        - `jobs`: one entry per scheduled job, in the order of the enum, with
          the end time and outcome of its last run that obtained the job's
          advisory lock since the API started (`null` before the first run;
          skipped runs are not recorded).

        Problem codes: `unauthorized` (401), `forbidden` (403).
      x-required-role: ADMIN
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Detailed status.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminHealth' }
              example:
                status: UP
                checkedAt: '2026-11-24T08:30:00Z'
                components:
                  scoring: { status: UP }
                  database: { status: UP }
                  fx: { status: UP, newestAsOf: '2026-11-23', rateAgeDays: 1, stale: false }
                  outbox: { status: UP, pending: 0, failed: 0, deadLetter: 0, oldestPendingAt: null }
                jobs:
                  - { name: OUTBOX_PROCESSOR, lastRunAt: '2026-11-24T08:29:55Z', lastOutcome: SUCCEEDED }
                  - { name: FX_REFRESH, lastRunAt: '2026-11-24T06:00:02Z', lastOutcome: SUCCEEDED }
                  - { name: SUBSCRIPTION_EXPIRY, lastRunAt: '2026-11-24T00:05:01Z', lastOutcome: SUCCEEDED }
                  - { name: HOUSEKEEPING_IDENTITY, lastRunAt: '2026-11-24T03:15:04Z', lastOutcome: SUCCEEDED }
                  - { name: HOUSEKEEPING_ALERTS, lastRunAt: '2026-11-24T03:15:03Z', lastOutcome: SUCCEEDED }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/imports/products:
    post:
      tags: [AdminImports]
      operationId: importProducts
      summary: Import a products document
      description: |
        Requires role ADMIN. Accepts the products JSON document (products,
        nutrients, availability and offers) defined by the JSON Schema
        `contracts/schemas/import-products.schema.json`; products are upserted
        by `code`. The import is asynchronous: the response is `202` with the
        job as created (normally `RUNNING`) and its URL in `Location`; the job
        status, summary and row errors are read with
        `GET /admin/imports/{jobId}`.

        The document is validated as a whole before any write: invalid UTF-8
        (`invalid_encoding`), invalid JSON (`invalid_json`), schema violations
        (`schema_violation`) and the semantic rules of the schema (for example
        `unknown_nutrient`, `invalid_form_code`, `form_nutrient_mismatch`,
        `unsupported_iu_form`, `currency_mismatch`, `invalid_offer_url`,
        `checked_at_in_future`) are reported as job errors. A document with
        more than 50 000 products fails with the single error
        `too_many_records`; a string value longer than 4096 characters or a
        nesting deeper than 64 levels is `invalid_json`. Parser failures carry
        a fixed message with line and column only. Validation stops after
        1000 errors: the job then lists those errors and one `too_many_errors`
        error. Any error fails the whole job: nothing is written,
        `catalog_version` is not bumped and no outbox event is written. Form codes are validated against the form
        registry table. A successful import bumps `catalog_version` exactly
        once; re-importing the same document changes no row.

        Problem codes: `unauthorized` (401), `forbidden` (403), body larger than
        20 MB (413), body not `application/json` (415), `validation_failed`
        (422, empty request body only; content errors are job errors),
        `internal_error` (500).
      x-required-role: ADMIN
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        description: Products document; its structure is defined by `contracts/schemas/import-products.schema.json`.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductsImportDocument' }
      responses:
        '202':
          description: Import job created.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Location: { $ref: '#/components/headers/ImportJobLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
              example: { id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f, kind: PRODUCTS_JSON, status: RUNNING, createdAt: '2026-11-24T08:30:00Z', finishedAt: null, summary: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/imports/offers:
    post:
      tags: [AdminImports]
      operationId: importOffers
      summary: Import an offers CSV file
      description: |
        Requires role ADMIN. Upserts offers by natural key (product, country,
        retailer) within the countries covered by the file; for every
        (product, country) pair in the file, offers of retailers absent from the
        file are deleted. Rows reference products by `product_code`. The file
        format and every error code are defined in
        `contracts/schemas/offers-csv.columns.md`. The import is asynchronous:
        the response is `202` with the job as created (normally `RUNNING`) and
        its URL in `Location`.

        File-level failures (`invalid_encoding`, `invalid_csv` for an
        unparseable file such as an unterminated quoted field,
        `invalid_header`, `too_many_records` for more than 200 000 data rows)
        and row errors (for example `wrong_column_count`, `field_too_long`,
        `currency_mismatch`, `invalid_offer_url`, `checked_at_in_future`) are
        reported on the job; validation stops after 1000 errors and adds one
        `too_many_errors` error. Any error fails the whole job: nothing is
        written, `catalog_version` is not bumped and no `OFFERS_CHANGED` event
        is written. A successful import bumps `catalog_version` exactly once;
        re-importing the same file changes no row.

        Problem codes: `unauthorized` (401), `forbidden` (403), file larger than
        20 MB (413), request not `multipart/form-data` (415),
        `validation_failed` (422: missing `file` part, or a multipart body the
        server cannot parse, for example a part whose file name contains
        control characters - field `file`, code `invalid_format`; the file
        name is never used; content errors are job errors),
        `internal_error` (500).
      x-required-role: ADMIN
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/OffersImportUpload' }
            encoding:
              file:
                contentType: text/csv
      responses:
        '202':
          description: Import job created.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Location: { $ref: '#/components/headers/ImportJobLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
              example: { id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f, kind: OFFERS_CSV, status: RUNNING, createdAt: '2026-11-24T08:30:00Z', finishedAt: null, summary: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/imports/{jobId}:
    get:
      tags: [AdminImports]
      operationId: getImportJob
      summary: Import job status, summary and row errors
      description: |
        Requires role ADMIN. A `RUNNING` job has `finishedAt` and `summary`
        `null` and an empty `errors` array; a `SUCCEEDED` job has the write counts in `summary` and
        no errors; a `FAILED` job lists every error, ordered by `rowNumber`
        and then by detection order, and its `summary` carries the rows read
        with all write counts 0.

        Problem codes: `unauthorized` (401), `forbidden` (403), 404
        (`about:blank`, unknown id or an id that is not a UUID).
      x-required-role: ADMIN
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: jobId
          in: path
          required: true
          description: Import job id.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Import job.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJobDetail' }
              example:
                id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                kind: OFFERS_CSV
                status: FAILED
                createdAt: '2026-11-24T08:30:00Z'
                finishedAt: '2026-11-24T08:30:02Z'
                summary: { rows: 120, inserted: 0, updated: 0, unchanged: 0, deleted: 0, changedPairs: 0 }
                errors:
                  - { rowNumber: 17, code: currency_mismatch, message: 'currency_mismatch: currency EUR differs from the country currency TRY (row 17)' }
                  - { rowNumber: 42, code: invalid_offer_url, message: 'invalid_offer_url: url must be an absolute http or https URI (row 42)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/users:
    get:
      tags: [AdminUsers]
      operationId: listUsers
      summary: Search users
      description: |
        Requires role ADMIN. Never returns password hashes. Results are ordered
        newest first.

        Problem codes: `unauthorized` (401), `forbidden` (403),
        `validation_failed` (422, including a `q` that contains control
        characters).
      x-required-role: ADMIN
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: q
          in: query
          required: false
          description: Case-insensitive substring search over the e-mail address. Control characters are rejected (422).
          schema: { type: string, minLength: 1, maxLength: 254, pattern: '^[^\x00-\x1F\x7F]*$' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of users.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
              example:
                meta: { page: 1, pageSize: 20, total: 1 }
                items:
                  - { id: 9f1c2d3e-4b5a-4c6d-8e7f-0a1b2c3d4e5f, email: user@example.com, role: USER, status: ACTIVE, plan: FREE, emailVerified: true, createdAt: '2026-11-01T10:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/users/{id}/subscription:
    post:
      tags: [AdminUsers]
      operationId: grantSubscription
      summary: Grant PRO manually
      description: |
        Requires role ADMIN. Activates PRO for `durationDays` with source
        `MANUAL`, or extends an existing PRO period.

        Problem codes: `unauthorized` (401), `forbidden` (403), 404
        (`about:blank`), `conflict_retry` (409), `validation_failed` (422).
      x-required-role: ADMIN
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantSubscriptionRequest' }
            example: { planCode: PRO, durationDays: 30 }
      responses:
        '200':
          description: Subscription now in effect for the user.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/users/{id}/status:
    post:
      tags: [AdminUsers]
      operationId: setUserStatus
      summary: Enable or disable a user
      description: |
        Requires role ADMIN. Setting `DISABLED` revokes all refresh-token
        families of the user in the same transaction. Every `/admin/**`
        request re-reads the caller's role and status, so a disabled or
        demoted administrator is rejected immediately (`forbidden`, 403). An
        administrator cannot change their own status (`forbidden`, 403).

        Problem codes: `unauthorized` (401), `forbidden` (403), 404
        (`about:blank`), `validation_failed` (422).
      x-required-role: ADMIN
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetUserStatusRequest' }
            example: { status: DISABLED }
      responses:
        '200':
          description: Updated user.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/promo-codes:
    get:
      tags: [AdminPromoCodes]
      operationId: listPromoCodes
      summary: List promo codes
      description: |
        Requires role ADMIN.

        Problem codes: `unauthorized` (401), `forbidden` (403).
      x-required-role: ADMIN
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Promo codes.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoCodeList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [AdminPromoCodes]
      operationId: createPromoCode
      summary: Generate a promo code
      description: |
        Requires role ADMIN. The code is generated server-side as the optional
        prefix, a hyphen and 16 Crockford base32 characters from a CSPRNG
        (80 bits of entropy); without a prefix the code is the 16 characters
        alone. The generated code is returned in this response.

        Problem codes: `unauthorized` (401), `forbidden` (403),
        `validation_failed` (422).
      x-required-role: ADMIN
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePromoCodeRequest' }
            example: { prefix: LAUNCH, planCode: PRO, durationDays: 30, maxRedemptions: 100, expiresAt: '2027-01-31T23:59:59Z' }
      responses:
        '201':
          description: Promo code created.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoCode' }
              example: { code: LAUNCH-7K3M9QXT2B4N6PRW, planCode: PRO, durationDays: 30, maxRedemptions: 100, redeemedCount: 0, expiresAt: '2027-01-31T23:59:59Z', createdBy: 9f1c2d3e-4b5a-4c6d-8e7f-0a1b2c3d4e5f }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/promo-codes/{code}:
    delete:
      tags: [AdminPromoCodes]
      operationId: deletePromoCode
      summary: Delete a promo code
      description: |
        Requires role ADMIN. Lookup is case-insensitive.

        Problem codes: `unauthorized` (401), `forbidden` (403), 404
        (`about:blank`).
      x-required-role: ADMIN
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: code
          in: path
          required: true
          description: Promo code.
          schema: { $ref: '#/components/schemas/PromoCodeValue' }
      responses:
        '204':
          description: Deleted.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/fx/refresh:
    post:
      tags: [AdminOperations]
      operationId: refreshFxRates
      summary: Run the FX refresh job now
      description: |
        Requires role ADMIN. Runs the FX refresh job (`FxRefreshJob`) once,
        synchronously, under the job's advisory lock: for every supported base
        currency one provider call for all other supported currencies, each
        result upserted in its own short transaction. A failed call (timeout,
        non-2xx, empty array, missing quote, mixed dates) is logged with a
        metric, leaves the stored rates of that base in use and does not stop
        the other bases; the response is still 200 and lists the base in
        `failedBases`. With four supported currencies a complete run upserts
        12 rows.

        Problem codes: `unauthorized` (401), `forbidden` (403),
        `conflict_retry` (409, the refresh job is running at this moment and
        holds its lock; nothing was fetched).
      x-required-role: ADMIN
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Refresh finished.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxRefreshResult' }
              examples:
                complete:
                  summary: Every base refreshed
                  value: { upsertedRows: 12, failedBases: [] }
                providerDown:
                  summary: Provider unreachable; stored rates stay in use
                  value: { upsertedRows: 0, failedBases: [EUR, GBP, TRY, USD] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/outbox/stats:
    get:
      tags: [AdminOperations]
      operationId: getOutboxStats
      summary: Outbox backlog counts
      description: |
        Requires role ADMIN. `pending` counts unprocessed events
        (`processed_at IS NULL`, claimed or not), `failed` the unprocessed
        events with at least one failed attempt (`attempts > 0`),
        `deadLetter` the retained events processed with outcome
        `DEAD_LETTER`, and `oldestPendingAt` is the `created_at` of the
        oldest unprocessed event. One read-only query; no event is claimed or
        changed.

        Problem codes: `unauthorized` (401), `forbidden` (403),
        `internal_error` (500).
      x-required-role: ADMIN
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Counts.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboxStats' }
              example: { pending: 3, failed: 1, deadLetter: 0, oldestPendingAt: '2026-11-24T08:20:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token (HS256 JWT, 15 minutes) from `POST /auth/login` or
        `POST /auth/refresh`. Claims: `sub` (user id), `role` (`USER` or
        `ADMIN`), `email_verified`, `jti`; header `kid`. The plan is not a
        claim; it is always read from the server.
    refreshCookie:
      type: apiKey
      in: cookie
      name: vd_refresh
      description: |
        Rotating refresh token (256-bit random, 30 days). `HttpOnly`,
        `SameSite=Strict`, `Path=/api/v1/auth`, `Secure` outside development.
    anonCookie:
      type: apiKey
      in: cookie
      name: vd_anon
      description: |
        Signed anonymous identity (128-bit random id, HMAC-SHA256). `HttpOnly`,
        `SameSite=Lax`, `Secure` outside development, max-age 180 days. Created
        by `POST /recommendations/query` or `GET /session/quota` when missing.

  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Client-supplied request id. Accepted only when it matches the pattern;
        otherwise, or when absent, the API generates a new id. Never rejected.
      schema: { $ref: '#/components/schemas/RequestId' }
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: CSRF guard for cookie-scoped auth endpoints; any other value is rejected with 403 `forbidden`.
      schema:
        type: string
        enum: [vitadelta]
    Origin:
      name: Origin
      in: header
      required: false
      description: When present, it must be one of the configured web origins; otherwise 403 `forbidden`.
      schema: { type: string, format: uri }
    CountryQueryRequired:
      name: country
      in: query
      required: true
      description: Country code; must exist in the country registry (422 `country_not_found` otherwise).
      schema: { $ref: '#/components/schemas/CountryCode' }
      example: TR
    DisplayCurrencyQuery:
      name: displayCurrency
      in: query
      required: false
      description: |
        Display currency. Resolution: this parameter, then the signed-in user's
        preference, then the native currency. Must be a supported currency
        (422 `fx_unsupported_currency` otherwise).
      schema: { $ref: '#/components/schemas/CurrencyCode' }
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema: { type: integer, format: int32, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Page size.
      schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }
    ProductIdPath:
      name: id
      in: path
      required: true
      description: Product id.
      schema: { type: string, format: uuid }
    AlertIdPath:
      name: id
      in: path
      required: true
      description: Alert subscription id.
      schema: { type: string, format: uuid }
    NotificationIdPath:
      name: id
      in: path
      required: true
      description: Notification id.
      schema: { type: string, format: uuid }
    UserIdPath:
      name: id
      in: path
      required: true
      description: User id.
      schema: { type: string, format: uuid }

  headers:
    XRequestId:
      description: Request id in effect for this request (echoed or generated).
      required: true
      schema: { $ref: '#/components/schemas/RequestId' }
    RetryAfter:
      description: Seconds to wait before retrying.
      required: true
      schema: { type: integer, minimum: 1 }
    SetCookieAnon:
      description: |
        Sets `vd_anon` when the anonymous identity cookie was missing
        (`HttpOnly; SameSite=Lax; Max-Age=15552000; Path=/`, `Secure` outside
        development). Absent for signed-in callers and when the cookie exists.
      required: false
      schema: { type: string }
    SetCookieClearAnon:
      description: Clears `vd_anon` (`Max-Age=0`). Sent identically on every 202 response.
      required: true
      schema: { type: string }
    SetCookieRefresh:
      description: Sets the rotated `vd_refresh` cookie (`HttpOnly; SameSite=Strict; Path=/api/v1/auth; Max-Age=2592000`, `Secure` outside development).
      required: true
      schema: { type: string }
    SetCookieClearRefresh:
      description: Clears `vd_refresh` (`Path=/api/v1/auth; Max-Age=0`).
      required: true
      schema: { type: string }
    ImportJobLocation:
      description: URL of the import job resource (`/api/v1/admin/imports/{jobId}`).
      required: true
      schema: { type: string, format: uri-reference }

  responses:
    Unauthorized:
      description: |
        Missing, invalid or expired credentials. Codes: `unauthorized`,
        `invalid_credentials`, `refresh_reuse_detected`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://vitadelta.dev/problems/unauthorized
            title: Unauthorized
            status: 401
            detail: Authentication is required.
            instance: /api/v1/me
            requestId: 8c1d2e3f-4a5b-4c6d-9e7f-0a1b2c3d4e5f
    Forbidden:
      description: |
        The principal may not perform the action. Codes: `forbidden`,
        `account_disabled`, `email_not_verified`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://vitadelta.dev/problems/forbidden
            title: Forbidden
            status: 403
            detail: The ADMIN role is required.
            instance: /api/v1/admin/users
            requestId: 8c1d2e3f-4a5b-4c6d-9e7f-0a1b2c3d4e5f
    QuotaExceeded:
      description: The anonymous trial quota is used up. Code `quota_exceeded`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/QuotaExceededProblem' }
          example:
            type: https://vitadelta.dev/problems/quota_exceeded
            title: Query quota exceeded
            status: 403
            detail: The free trial queries are used up. Create an account to continue.
            instance: /api/v1/recommendations/query
            requestId: 8c1d2e3f-4a5b-4c6d-9e7f-0a1b2c3d4e5f
            limit: 3
            used: 3
            action: SIGN_UP
            upgradeHint: { messageKey: quota.exhausted, ctaPath: /auth/register }
    EntitlementForbidden:
      description: |
        Plan limit reached (`entitlement_exceeded`, body
        `EntitlementExceededProblem`) or e-mail not verified
        (`email_not_verified`, body `Problem`).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/EntitlementExceededProblem'
              - $ref: '#/components/schemas/Problem'
          examples:
            entitlementExceeded:
              summary: Saved-product limit of FREE reached
              value:
                type: https://vitadelta.dev/problems/entitlement_exceeded
                title: Plan limit reached
                status: 403
                detail: The FREE plan allows 5 saved products.
                instance: /api/v1/me/saved-products
                requestId: 8c1d2e3f-4a5b-4c6d-9e7f-0a1b2c3d4e5f
                limit: 5
                used: 5
                plan: FREE
                upgradeTo: PRO
                upgradeHint: { messageKey: limits.saved_products_reached, ctaPath: /upgrade }
            emailNotVerified:
              summary: Alert creation before e-mail verification
              value:
                type: https://vitadelta.dev/problems/email_not_verified
                title: E-mail not verified
                status: 403
                detail: Verify your e-mail address to create alerts.
                instance: /api/v1/me/alerts
                requestId: 8c1d2e3f-4a5b-4c6d-9e7f-0a1b2c3d4e5f
    NotFound:
      description: |
        Resource not found. Codes: `product_not_found`,
        `product_not_available_in_country`; other resources (alert,
        notification, user, import job, promo code) use `about:blank`. For
        caller-scoped resources (`/me/alerts/{id}`,
        `/me/notifications/{id}/read`) an id that does not exist, belongs to
        another user or is not a UUID gets the same 404 body (only
        `instance` and `requestId` differ).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://vitadelta.dev/problems/product_not_available_in_country
            title: Product not available in country
            status: 404
            detail: The product is not sold in GB.
            instance: /api/v1/products/3b2f0c4e-6a1d-4f0e-9c3a-1a2b3c4d5e01
            requestId: 8c1d2e3f-4a5b-4c6d-9e7f-0a1b2c3d4e5f
    Conflict:
      description: A concurrent change or run won (a subscription change, or a running job holding its lock); retry the request. Code `conflict_retry`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Request body exceeds the size limit (64 kB for every request body including the query, import JSON 20 MB, CSV 20 MB). Code `validation_failed`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: The request body is not `application/json`. Generic problem with type `about:blank`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Unsupported Media Type
            status: 415
            detail: Unsupported Media Type.
            instance: /api/v1/me
            requestId: 8c1d2e3f-4a5b-4c6d-9e7f-0a1b2c3d4e5f
    UnprocessableEntity:
      description: |
        The request is syntactically or semantically invalid. Codes:
        `validation_failed` (with `errors[]`), `country_not_found`,
        `fx_unsupported_currency`. A malformed value (for example a country
        or currency code that does not match its pattern) is
        `validation_failed`; a well-formed but unknown country is
        `country_not_found`; a well-formed currency outside the supported
        set is `fx_unsupported_currency`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://vitadelta.dev/problems/validation_failed
            title: Validation failed
            status: 422
            detail: The request contains invalid fields.
            instance: /api/v1/recommendations/query
            requestId: 8c1d2e3f-4a5b-4c6d-9e7f-0a1b2c3d4e5f
            errors:
              - { field: weights, code: weights_all_zero, message: The weights give every nutrient a weight of 0. }
              - { field: 'requiredNutrients[0].unit', code: unit_requires_form, message: IU is accepted only for VIT_D. }
    TokenRejected:
      description: The e-mail token is unknown, used or expired. Codes `token_invalid`, `token_expired`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://vitadelta.dev/problems/token_expired
            title: Token expired
            status: 400
            detail: The link has expired. Request a new one.
            instance: /api/v1/auth/verify-email
            requestId: 8c1d2e3f-4a5b-4c6d-9e7f-0a1b2c3d4e5f
    PromoInvalid:
      description: The promo code cannot be redeemed (one response for every reason). Code `promo_invalid`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://vitadelta.dev/problems/promo_invalid
            title: Promo code invalid
            status: 400
            detail: The promo code cannot be redeemed.
            instance: /api/v1/me/subscription/promo
            requestId: 8c1d2e3f-4a5b-4c6d-9e7f-0a1b2c3d4e5f
    TooManyRequests:
      description: Rate limit exceeded. Code `rate_limited`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://vitadelta.dev/problems/rate_limited
            title: Too many requests
            status: 429
            detail: Try again later.
            instance: /api/v1/auth/login
            requestId: 8c1d2e3f-4a5b-4c6d-9e7f-0a1b2c3d4e5f
    ScoringUnavailable:
      description: The scoring service is unavailable, the circuit is open, the API instance has reached its limit of concurrent scoring calls, or the country's catalog exceeds the supported size (an operator error, logged). Code `scoring_unavailable`. Anonymous quota is not consumed.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://vitadelta.dev/problems/scoring_unavailable
            title: Scoring unavailable
            status: 503
            detail: The ranking service is temporarily unavailable.
            instance: /api/v1/recommendations/query
            requestId: 8c1d2e3f-4a5b-4c6d-9e7f-0a1b2c3d4e5f
    InternalError:
      description: Unexpected server error. Code `internal_error`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ---------- Primitives ----------
    RequestId:
      type: string
      pattern: '^[A-Za-z0-9-]{1,64}$'
      example: 8c1d2e3f-4a5b-4c6d-9e7f-0a1b2c3d4e5f
    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2 country code of the country registry.
      pattern: '^[A-Z]{2}$'
      example: TR
    CurrencyCode:
      type: string
      description: ISO 4217 currency code.
      pattern: '^[A-Z]{3}$'
      example: TRY
    NutrientCode:
      type: string
      description: Code of the nutrient registry.
      pattern: '^[A-Z][A-Z0-9_]{0,39}$'
      example: VIT_C
    ProductCode:
      type: string
      description: Human-readable business key of a product.
      pattern: '^[A-Z0-9][A-Z0-9-]{1,39}$'
      maxLength: 40
      example: GOLD-A
    PromoCodeValue:
      type: string
      description: Promo code; optional prefix and hyphen followed by 16 Crockford base32 characters. Matched case-insensitively.
      pattern: '^([A-Za-z0-9]{1,16}-)?[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{16}$'
      example: LAUNCH-7K3M9QXT2B4N6PRW
    Locale:
      type: string
      enum: [tr, en]
    Email:
      type: string
      format: email
      maxLength: 254
      pattern: '^[^\x00-\x1F\x7F]*$'
      description: |
        E-mail address. Control characters are rejected (422
        `validation_failed`). Addresses are stored, compared and returned
        without surrounding white space and in lower case.
      example: user@example.com
    Money:
      type: number
      description: Monetary amount rounded once to 4 decimals.
    HealthStatus:
      type: string
      enum: [UP, DEGRADED, DOWN]

    # ---------- Enumerations ----------
    NutrientCategory:
      type: string
      enum: [VITAMIN, MINERAL, COENZYME, OTHER]
    CanonicalUnit:
      type: string
      enum: [mg, mcg]
    InputUnit:
      type: string
      description: Accepted query unit. `IU` is accepted only for `VIT_D`.
      enum: [mg, mcg, g, IU]
    DosageForm:
      type: string
      enum: [TABLET, CAPSULE, SOFTGEL, GUMMY, POWDER, LIQUID]
    AvailabilityStatus:
      type: string
      enum: [AVAILABLE, NOT_SOLD, DISCONTINUED]
    ReferenceSource:
      type: string
      enum: [REGULATORY, MARKET_MEDIAN, PRESENCE_ONLY]
    StockFilter:
      type: string
      enum: [IN_STOCK_ONLY, INCLUDE_OUT_OF_STOCK]
    RankingMode:
      type: string
      enum: [PRICE, RICHNESS, VALUE, CUSTOM]
    Verdict:
      type: string
      enum: [WORTH_IT, MARGINAL, NOT_WORTH_IT, DOMINATES, EQUIVALENT, INSUFFICIENT_DATA]
    ProductFlagCode:
      type: string
      description: |
        Product-level safety and data flags. `FX_STALE`, `FX_UNAVAILABLE` and
        `UNAVAILABLE_IN_COUNTRY` are added by the API; the others come from the
        scoring engine or the effective-price resolution. `FX_STALE` is set
        on every money-bearing item when `meta.fx.stale` is `true`,
        `FX_UNAVAILABLE` when `meta.fx.status` is `UNAVAILABLE`.
        `UNAVAILABLE_IN_COUNTRY` is used only on saved products
        (`SavedProduct.flags`) whose availability is not `AVAILABLE`; alert
        list items show the same state through `product.availabilityStatus`.
        Catalog and recommendation responses never contain unavailable
        products and never carry it.
      enum:
        - EXCEEDS_UL
        - UL_FORM_DEPENDENT
        - CONVERSION_ASSUMED
        - PRICE_STALE
        - OUT_OF_STOCK
        - MARKET_MEDIAN_REFERENCE_USED
        - PRESENCE_ONLY_NUTRIENTS
        - BELOW_PRESENCE_FLOOR
        - FX_STALE
        - FX_UNAVAILABLE
        - UNAVAILABLE_IN_COUNTRY
    DeltaRowFlag:
      type: string
      enum: [NEW_IN_B, REMOVED_IN_B, DIMINISHING, ABOVE_CEILING_NO_CREDIT, ABOVE_UL_NO_CREDIT]
    Role:
      type: string
      enum: [USER, ADMIN]
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    PlanCode:
      type: string
      enum: [FREE, PRO]
    SubscriptionStatus:
      type: string
      enum: [ACTIVE, EXPIRED, CANCELED]
    SubscriptionSource:
      type: string
      enum: [MANUAL, PROMO, PROVIDER]
    AlertTrigger:
      type: string
      enum: [PRICE_DROP, BACK_IN_STOCK, PRICE_CHANGE]
    NotificationType:
      type: string
      enum: [ALERT_PRICE_DROP, ALERT_BACK_IN_STOCK, ALERT_PRICE_CHANGE, NOTIFICATION_CAP_REACHED, PLAN_ACTIVATED, PLAN_EXPIRED]
    ImportJobKind:
      type: string
      enum: [PRODUCTS_JSON, OFFERS_CSV]
    ImportJobStatus:
      type: string
      enum: [RUNNING, SUCCEEDED, FAILED]
    FxStatus:
      type: string
      description: '`UNAVAILABLE` when no rate exists for the pair; money is then returned in the native currency.'
      enum: [OK, UNAVAILABLE]

    # ---------- Errors ----------
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, requestId]
      properties:
        type:
          type: string
          format: uri
          description: '`https://vitadelta.dev/problems/<code>`, or `about:blank` for generic HTTP errors.'
          enum:
            - https://vitadelta.dev/problems/validation_failed
            - https://vitadelta.dev/problems/country_not_found
            - https://vitadelta.dev/problems/product_not_found
            - https://vitadelta.dev/problems/product_not_available_in_country
            - https://vitadelta.dev/problems/currency_mismatch
            - https://vitadelta.dev/problems/scoring_unavailable
            - https://vitadelta.dev/problems/unauthorized
            - https://vitadelta.dev/problems/forbidden
            - https://vitadelta.dev/problems/invalid_credentials
            - https://vitadelta.dev/problems/account_disabled
            - https://vitadelta.dev/problems/email_not_verified
            - https://vitadelta.dev/problems/token_invalid
            - https://vitadelta.dev/problems/token_expired
            - https://vitadelta.dev/problems/refresh_reuse_detected
            - https://vitadelta.dev/problems/quota_exceeded
            - https://vitadelta.dev/problems/entitlement_exceeded
            - https://vitadelta.dev/problems/promo_invalid
            - https://vitadelta.dev/problems/conflict_retry
            - https://vitadelta.dev/problems/fx_unsupported_currency
            - https://vitadelta.dev/problems/rate_limited
            - https://vitadelta.dev/problems/unsupported_iu_form
            - https://vitadelta.dev/problems/invalid_offer_url
            - https://vitadelta.dev/problems/import_failed
            - https://vitadelta.dev/problems/internal_error
            - about:blank
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        instance:
          type: string
          format: uri-reference
          description: Request path of this occurrence.
        requestId: { $ref: '#/components/schemas/RequestId' }
        errors:
          type: array
          description: Field errors; present for `validation_failed`.
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: JSON path of the offending field, for example `requiredNutrients[0].unit`.
        code:
          type: string
          description: Machine-readable reason, for example `weights_all_zero`, `unit_requires_form`, `required`, `out_of_range`, `unknown_nutrient_code`, `lambda_requires_custom`, `same_product`, `no_offer`, `no_stock`, `value_out_of_range`, `threshold_not_allowed`.
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
    UpgradeHint:
      type: object
      description: What the web app renders as call to action for a limit error.
      required: [messageKey, ctaPath]
      properties:
        messageKey:
          type: string
          description: i18n key of the notice text.
        ctaPath:
          type: string
          description: Relative path of the call-to-action link.
          pattern: '^/'
    QuotaExceededProblem:
      description: '`quota_exceeded` with its extension members.'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [limit, used, action, upgradeHint]
          properties:
            type:
              const: https://vitadelta.dev/problems/quota_exceeded
            limit: { type: integer, minimum: 0 }
            used: { type: integer, minimum: 0 }
            action:
              type: string
              enum: [SIGN_UP]
            upgradeHint: { $ref: '#/components/schemas/UpgradeHint' }
    EntitlementExceededProblem:
      description: '`entitlement_exceeded` with its extension members.'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [limit, used, plan, upgradeTo, upgradeHint]
          properties:
            type:
              const: https://vitadelta.dev/problems/entitlement_exceeded
            limit: { type: integer, minimum: 0 }
            used: { type: integer, minimum: 0 }
            plan: { $ref: '#/components/schemas/PlanCode' }
            upgradeTo: { $ref: '#/components/schemas/PlanCode' }
            upgradeHint: { $ref: '#/components/schemas/UpgradeHint' }

    # ---------- System ----------
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/HealthStatus' }
    LegalInfo:
      type: object
      required: [privacyContact]
      properties:
        privacyContact:
          type: string
          minLength: 1
          description: Controller contact shown on the privacy notice.
          example: privacy@example.com
    EmptyObject:
      type: object
      description: An empty JSON object.
      maxProperties: 0

    # ---------- Reference data ----------
    Country:
      type: object
      required: [code, nameEn, currency, referenceSetCode, ulSetCode, defaultLocale]
      properties:
        code: { $ref: '#/components/schemas/CountryCode' }
        nameEn: { type: string }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        referenceSetCode: { type: string, example: EU_NRV }
        ulSetCode: { type: string, example: EFSA }
        defaultLocale: { $ref: '#/components/schemas/Locale' }
    CountryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Country' }
    Nutrient:
      type: object
      required: [code, nameEn, category, canonicalUnit, presenceFloorPerDay, sortOrder, referenceSetCodes]
      properties:
        code: { $ref: '#/components/schemas/NutrientCode' }
        nameEn: { type: string }
        category: { $ref: '#/components/schemas/NutrientCategory' }
        canonicalUnit: { $ref: '#/components/schemas/CanonicalUnit' }
        presenceFloorPerDay:
          type: [number, 'null']
          minimum: 0
          description: Presence floor per day in the canonical unit; `null` when unknown.
        sortOrder: { type: integer }
        referenceSetCodes:
          type: array
          description: Reference sets that define a value for this nutrient.
          items: { type: string }
        forms:
          type: array
          description: Registered forms of this nutrient from the form registry, ordered by `code`; empty when the nutrient has none. Product rows may also carry the sentinel `UNKNOWN`, which is not listed.
          items: { $ref: '#/components/schemas/NutrientForm' }
    NutrientForm:
      type: object
      required: [code, nameEn]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,39}$'
          example: D3_CHOLECALCIFEROL
        nameEn:
          type: string
          example: Vitamin D3 (cholecalciferol)
    NutrientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Nutrient' }
    NumberRange:
      type: object
      required: [min, max]
      properties:
        min: { type: number }
        max: { type: number }
    CategoryWeights:
      type: object
      description: Category weights in [0.0, 2.0]. Missing categories use the default weight.
      additionalProperties: false
      properties:
        VITAMIN: { type: number, minimum: 0, maximum: 2 }
        MINERAL: { type: number, minimum: 0, maximum: 2 }
        COENZYME: { type: number, minimum: 0, maximum: 2 }
        OTHER: { type: number, minimum: 0, maximum: 2 }
    DefaultCategoryWeights:
      description: Default weight of every category.
      allOf:
        - $ref: '#/components/schemas/CategoryWeights'
      required: [VITAMIN, MINERAL, COENZYME, OTHER]
    NutrientOverrides:
      type: object
      description: Per-nutrient weight multipliers in [0.0, 3.0] (default 1.0). Keys must be registry codes; 0 removes the nutrient from the score but not from the breakdown.
      propertyNames: { $ref: '#/components/schemas/NutrientCode' }
      additionalProperties: { type: number, minimum: 0, maximum: 3 }
    Weights:
      type: object
      description: Weights must not make every registry nutrient 0 (422 `validation_failed`, `weights_all_zero`).
      properties:
        categories: { $ref: '#/components/schemas/CategoryWeights' }
        overrides: { $ref: '#/components/schemas/NutrientOverrides' }
    DefaultWeights:
      type: object
      required: [categories, categoryRange, overrideDefault, overrideRange, lambdaDefault, lambdaRange, engine]
      properties:
        categories: { $ref: '#/components/schemas/DefaultCategoryWeights' }
        categoryRange: { $ref: '#/components/schemas/NumberRange' }
        overrideDefault: { type: number }
        overrideRange: { $ref: '#/components/schemas/NumberRange' }
        lambdaDefault: { type: number, minimum: 0, maximum: 1 }
        lambdaRange: { $ref: '#/components/schemas/NumberRange' }
        engine:
          oneOf:
            - $ref: '#/components/schemas/EngineParameters'
            - type: 'null'
          description: Scoring-engine parameters from the scoring service's `GET /internal/v1/health`; `null` while the API has not obtained them since start-up.
    EngineParameters:
      type: object
      description: |
        Read-only scoring-engine parameters (scoring contract `EngineConfig`,
        renamed to camelCase, values copied unrounded). Display only: the web
        app never computes a score or a verdict from them.
      additionalProperties: false
      required: [diminishingBeta, utilityCeiling, verdictWorthItMaxRatio, verdictMarginalMaxRatio]
      properties:
        diminishingBeta:
          type: number
          exclusiveMinimum: 0
          description: Slope `beta` of the logarithmic segment of the utility curve (scoring `diminishing_beta`).
        utilityCeiling:
          type: number
          minimum: 1
          description: Utility ceiling `u_max` (scoring `utility_ceiling`).
        verdictWorthItMaxRatio:
          type: number
          exclusiveMinimum: 0
          description: Largest compare `ratio` that still yields `WORTH_IT` (scoring `verdict_worth_it_max_ratio`).
        verdictMarginalMaxRatio:
          type: number
          exclusiveMinimum: 0
          description: Largest compare `ratio` that still yields `MARGINAL`; above it the verdict is `NOT_WORTH_IT` (scoring `verdict_marginal_max_ratio`).

    # ---------- Recommendations ----------
    Ranking:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/RankingMode' }
        lambda:
          type: number
          minimum: 0
          maximum: 1
          description: Weight of content against price for `CUSTOM` only (default 0.5); sent with another mode it is rejected with 422.
    RequiredNutrient:
      type: object
      required: [code]
      dependentRequired:
        minAmountPerDay: [unit]
      properties:
        code: { $ref: '#/components/schemas/NutrientCode' }
        minAmountPerDay:
          type: number
          exclusiveMinimum: 0
          description: Minimum amount per day; when absent the nutrient only has to be present.
        unit:
          $ref: '#/components/schemas/InputUnit'
    RecommendationQueryRequest:
      type: object
      required: [country]
      properties:
        country: { $ref: '#/components/schemas/CountryCode' }
        stockFilter:
          allOf:
            - $ref: '#/components/schemas/StockFilter'
          default: IN_STOCK_ONLY
        ranking:
          allOf:
            - $ref: '#/components/schemas/Ranking'
          description: 'Defaults to `{ "mode": "VALUE" }`.'
        weights: { $ref: '#/components/schemas/Weights' }
        requiredNutrients:
          type: array
          items: { $ref: '#/components/schemas/RequiredNutrient' }
        excludeExceedingUl: { type: boolean, default: false }
        displayCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        page: { type: integer, format: int32, minimum: 1, default: 1 }
        pageSize: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }
    FxMeta:
      type: object
      description: |
        Conversion applied to every monetary field: displayed value = unrounded
        native value x `rate`, rounded once to 4 decimals; a value is never
        converted from an already rounded figure. `base` is the country's
        native currency and `quote` the resolved display currency. The rate is
        the stored row of the exact pair `(base, quote)` with the largest
        `as_of` (never inverted, never derived through a third currency).
        For the identity pair `rate` is 1, `asOf`/`source` are `null`,
        `stale` is `false` and `status` is `OK`. With `status = UNAVAILABLE`
        (no stored row for the pair) `rate`, `asOf` and `source` are `null`,
        `stale` is `false`, money stays in the native currency and every
        money-bearing item carries the flag `FX_UNAVAILABLE`. A stored rate so
        small that a non-zero native amount of the response would be displayed
        as `0.0000` is not applied either (decided for the whole response, so
        one response never mixes currencies): `status` is `UNAVAILABLE`, money
        stays native with `FX_UNAVAILABLE` as above, `stale` is `false`, and
        `rate`, `asOf` and `source` identify the stored row that was not used.
        With `stale = true` every money-bearing item carries `FX_STALE`.
        `valueScore` is never converted.
      required: [base, quote, rate, asOf, source, stale, status]
      properties:
        base: { $ref: '#/components/schemas/CurrencyCode' }
        quote: { $ref: '#/components/schemas/CurrencyCode' }
        rate:
          type: [number, 'null']
          exclusiveMinimum: 0
          description: Stored rate (`numeric(18,8)`), written with its 8 decimals and never rounded; `1` for the identity pair.
        asOf:
          type: [string, 'null']
          format: date
          description: ECB publication date of the rate (the provider's `date`), not the fetch time.
        source:
          type: [string, 'null']
          enum: [FRANKFURTER, null]
        stale:
          type: boolean
          description: '`true` when `asOf` is more than 5 days before the current UTC date (`fx_stale_after_days = 5`).'
        status: { $ref: '#/components/schemas/FxStatus' }
    MoneyMeta:
      type: object
      required: [nativeCurrency, currency, fx]
      properties:
        nativeCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        currency:
          allOf:
            - $ref: '#/components/schemas/CurrencyCode'
          description: |
            Currency of every monetary field (display currency). Equals
            `nativeCurrency` when `fx.status` is `UNAVAILABLE`; `fx.quote` then
            names the requested currency.
        fx: { $ref: '#/components/schemas/FxMeta' }
    ExcludedCounts:
      type: object
      description: In-market products that are not ranked, counted in filter order. `noStock` and `noOffer` are decided by the API before scoring; `requiredNutrients` and `exceedsUl` come from the scoring service.
      required: [noStock, noOffer, requiredNutrients, exceedsUl]
      properties:
        noStock:
          type: integer
          minimum: 0
          description: '`IN_STOCK_ONLY` only: products with offers but none in stock.'
        noOffer:
          type: integer
          minimum: 0
          description: Products without any offer in the country.
        requiredNutrients: { type: integer, minimum: 0 }
        exceedsUl: { type: integer, minimum: 0 }
    Visibility:
      type: object
      description: 'ANONYMOUS: `shown = min(3, total)`, `locked = total - shown`, `reason = SIGN_UP_REQUIRED` when `locked > 0`, else `null`. USER and ADMIN: `shown` is the number of items on this page, `locked = 0`, `reason = null`.'
      required: [shown, total, locked, reason]
      properties:
        shown: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        locked: { type: integer, minimum: 0 }
        reason:
          type: [string, 'null']
          enum: [SIGN_UP_REQUIRED, null]
    AnonymousPrincipal:
      type: object
      required: [type, queriesUsed, queriesLimit]
      properties:
        type: { const: ANONYMOUS }
        queriesUsed: { type: integer, minimum: 0 }
        queriesLimit: { type: integer, minimum: 0 }
    UserPrincipal:
      type: object
      required: [type, plan]
      properties:
        type:
          type: string
          enum: [USER, ADMIN]
        plan: { $ref: '#/components/schemas/PlanCode' }
    PrincipalSummary:
      oneOf:
        - $ref: '#/components/schemas/AnonymousPrincipal'
        - $ref: '#/components/schemas/UserPrincipal'
    QueryMeta:
      type: object
      required: [country, nativeCurrency, currency, fx, catalogVersion, marketSize, mRef, excluded, visibility, principal, page, pageSize, total]
      properties:
        country: { $ref: '#/components/schemas/CountryCode' }
        nativeCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        fx: { $ref: '#/components/schemas/FxMeta' }
        catalogVersion: { type: integer, format: int64, minimum: 0 }
        marketSize:
          type: integer
          minimum: 0
          description: Number of scored candidates (in market and with an effective price under `stockFilter`) before the required-nutrient and upper-limit filters.
        mRef:
          type: [number, 'null']
          description: |
            Market marginal rate (median of cost per day per content point over
            the `marketSize` candidates with content above 0) in `currency`.
            `null` when fewer than three of them have content above 0; unlike
            compare, the query has no single-product fallback.
        excluded: { $ref: '#/components/schemas/ExcludedCounts' }
        visibility: { $ref: '#/components/schemas/Visibility' }
        principal:
          allOf:
            - $ref: '#/components/schemas/PrincipalSummary'
          description: Caller of this query; for `ANONYMOUS`, `queriesUsed` includes this query.
        page:
          type: integer
          minimum: 1
          description: Requested page, echoed also when it is beyond the last page.
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          minimum: 0
          description: Number of ranked products after all filters (`marketSize - excluded.requiredNutrients - excluded.exceedsUl`); equals `visibility.total`.
    Cost:
      type: object
      required: [effectivePrice, effectivePriceNative, currency, servingsPerContainer, daysSupply, costPerDay, costPerDayNative, priceStale, outOfStock]
      properties:
        effectivePrice:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          exclusiveMinimum: 0
          description: Effective price in the display currency.
        effectivePriceNative:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          exclusiveMinimum: 0
          description: Effective price in the country's native currency.
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        servingsPerContainer: { type: number, exclusiveMinimum: 0 }
        daysSupply: { type: number, exclusiveMinimum: 0 }
        costPerDay:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          exclusiveMinimum: 0
          description: Cost per day in the display currency.
        costPerDayNative:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          exclusiveMinimum: 0
          description: Cost per day in the country's native currency.
        priceStale: { type: boolean }
        outOfStock: { type: boolean }
    ProductFlag:
      type: object
      description: Scoring flags first, in the scoring service's order, then the API flags `FX_STALE`, `FX_UNAVAILABLE`; each code at most once. On saved products that are not `AVAILABLE` the only flag is `UNAVAILABLE_IN_COUNTRY`.
      required: [code, nutrientCodes]
      properties:
        code: { $ref: '#/components/schemas/ProductFlagCode' }
        nutrientCodes:
          type: array
          uniqueItems: true
          description: Affected nutrients, sorted ascending, for `EXCEEDS_UL`, `UL_FORM_DEPENDENT`, `CONVERSION_ASSUMED`, `MARKET_MEDIAN_REFERENCE_USED`, `PRESENCE_ONLY_NUTRIENTS` and `BELOW_PRESENCE_FLOOR`; empty for `PRICE_STALE`, `OUT_OF_STOCK`, `FX_STALE`, `FX_UNAVAILABLE` and `UNAVAILABLE_IN_COUNTRY`.
          items: { $ref: '#/components/schemas/NutrientCode' }
    BreakdownRow:
      type: object
      description: One scored nutrient of a product. Breakdown rows are ordered by `code` ascending.
      required: [code, category, amountPerDay, ulAmountPerDay, unit, reference, referenceSource, coverageRatio, utility, weight, contribution, cappedAtUl, cappedAtUMax, ulBelowReference, belowPresenceFloor]
      properties:
        code: { $ref: '#/components/schemas/NutrientCode' }
        category: { $ref: '#/components/schemas/NutrientCategory' }
        amountPerDay: { type: number, exclusiveMinimum: 0 }
        ulAmountPerDay: { type: number, minimum: 0 }
        unit: { $ref: '#/components/schemas/CanonicalUnit' }
        reference:
          type: [number, 'null']
          description: Reference amount per day; `null` under `PRESENCE_ONLY`.
        referenceSource: { $ref: '#/components/schemas/ReferenceSource' }
        coverageRatio:
          type: [number, 'null']
          minimum: 0
          description: Coverage ratio after the upper-limit cap; `null` under `PRESENCE_ONLY`.
        utility: { type: number, minimum: 0 }
        weight: { type: number, minimum: 0 }
        contribution:
          type: number
          minimum: 0
          description: weight x utility.
        cappedAtUl: { type: boolean }
        cappedAtUMax: { type: boolean }
        ulBelowReference:
          type: boolean
          description: The applicable upper limit is lower than the resolved reference.
        belowPresenceFloor:
          type: boolean
          description: '`PRESENCE_ONLY` row below 10 % of the presence floor (utility 0).'
    SelectedOffer:
      type: object
      required: [retailer, url, checkedAt]
      properties:
        retailer: { type: string }
        url: { type: string, format: uri, maxLength: 2048 }
        checkedAt: { type: string, format: date-time }
    ProductProvenance:
      type: object
      description: |
        Where the product's label data comes from. Synthetic fixture products
        have `synthetic = true`. Real label snapshots (`source = DSLD`) have
        `synthetic = false`, the label id in `sourceRef` and the label's entry
        date in `sourceEntryDate`, which the web app shows as the snapshot
        date. Offer prices in this release are demo values for every product.
      required: [synthetic, source, sourceRef, sourceEntryDate]
      properties:
        synthetic: { type: boolean }
        source:
          type: [string, 'null']
          maxLength: 500
          example: DSLD
        sourceRef:
          type: [string, 'null']
          maxLength: 100
          example: '239077'
        sourceEntryDate:
          type: [string, 'null']
          format: date
          example: '2020-11-21'
    RankedProduct:
      type: object
      description: Scored product with product metadata and the caller's saved state.
      required: [productId, code, rank, brand, name, dosageForm, provenance, cost, contentScore, contentScoreDisplay, valueScore, valueScoreDisplay, customScore, flags, breakdown, topContributors, selectedOffer, saved, alerts]
      properties:
        productId: { type: string, format: uuid }
        code: { $ref: '#/components/schemas/ProductCode' }
        rank:
          type: integer
          minimum: 1
          description: Position in the full ranking (not in the page).
        brand: { type: string }
        name: { type: string }
        dosageForm: { $ref: '#/components/schemas/DosageForm' }
        provenance: { $ref: '#/components/schemas/ProductProvenance' }
        cost: { $ref: '#/components/schemas/Cost' }
        contentScore:
          type: number
          minimum: 0
          description: Raw content score C, used for ranking.
        contentScoreDisplay: { type: number, minimum: 0, maximum: 100 }
        valueScore:
          type: number
          minimum: 0
          description: Value score V = C / cost per day, per unit of `meta.nativeCurrency`; never converted.
        valueScoreDisplay: { type: number, minimum: 0, maximum: 100 }
        customScore:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Score S for `CUSTOM` mode; `null` for other modes.
        flags:
          type: array
          items: { $ref: '#/components/schemas/ProductFlag' }
        breakdown:
          type: array
          items: { $ref: '#/components/schemas/BreakdownRow' }
        topContributors:
          type: array
          maxItems: 5
          description: First 5 breakdown rows by contribution descending.
          items: { $ref: '#/components/schemas/BreakdownRow' }
        selectedOffer: { $ref: '#/components/schemas/SelectedOffer' }
        saved:
          type: boolean
          description: Whether the caller has a saved-product row for this product in `meta.country`; `false` for anonymous callers. Read per request after paging, never cached with the ranking.
        alerts:
          type: array
          maxItems: 3
          description: The caller's alert subscriptions (active and inactive) on this product in `meta.country`, ordered by `trigger` (`PRICE_DROP`, `BACK_IN_STOCK`, `PRICE_CHANGE`); empty for anonymous callers. Read per request after paging, never cached with the ranking.
          items: { $ref: '#/components/schemas/AlertSubscription' }
    RecommendationQueryResponse:
      type: object
      required: [meta, items]
      properties:
        meta: { $ref: '#/components/schemas/QueryMeta' }
        items:
          type: array
          items: { $ref: '#/components/schemas/RankedProduct' }
    CompareRequest:
      type: object
      required: [country, baselineProductId, candidateProductId]
      properties:
        country: { $ref: '#/components/schemas/CountryCode' }
        baselineProductId: { type: string, format: uuid }
        candidateProductId: { type: string, format: uuid }
        stockFilter:
          allOf:
            - $ref: '#/components/schemas/StockFilter'
          default: IN_STOCK_ONLY
        weights: { $ref: '#/components/schemas/Weights' }
        displayCurrency: { $ref: '#/components/schemas/CurrencyCode' }
    CompareMeta:
      type: object
      required: [country, nativeCurrency, currency, fx, catalogVersion, marketSize]
      properties:
        country: { $ref: '#/components/schemas/CountryCode' }
        nativeCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        fx: { $ref: '#/components/schemas/FxMeta' }
        catalogVersion: { type: integer, format: int64, minimum: 0 }
        marketSize:
          type: integer
          minimum: 2
          description: De-duplicated size of the market set used for `mRef`, including A and B.
    ComparedProduct:
      type: object
      description: One side of the comparison. The scoring service's per-product breakdown is not exposed here; per-nutrient detail is in `rows`.
      required: [productId, code, brand, name, dosageForm, provenance, cost, contentScore, valueScore, flags, selectedOffer]
      properties:
        productId: { type: string, format: uuid }
        code: { $ref: '#/components/schemas/ProductCode' }
        brand: { type: string }
        name: { type: string }
        dosageForm: { $ref: '#/components/schemas/DosageForm' }
        provenance: { $ref: '#/components/schemas/ProductProvenance' }
        cost: { $ref: '#/components/schemas/Cost' }
        contentScore: { type: number, minimum: 0 }
        valueScore:
          type: number
          minimum: 0
          description: Per unit of `meta.nativeCurrency`; never converted.
        flags:
          type: array
          items: { $ref: '#/components/schemas/ProductFlag' }
        selectedOffer: { $ref: '#/components/schemas/SelectedOffer' }
    DeltaRow:
      type: object
      description: Per-nutrient delta over the union of nutrients in A and B, ordered by `code` ascending. Amounts are daily amounts; an amount of 0 means the nutrient is absent (utility 0, ratio 0, or `null` under `PRESENCE_ONLY`). Rows with `deltaAmount = 0` carry no flags.
      required: [code, category, amountA, amountB, deltaAmount, unit, rA, rB, uA, uB, weight, deltaContribution, flags]
      properties:
        code: { $ref: '#/components/schemas/NutrientCode' }
        category: { $ref: '#/components/schemas/NutrientCategory' }
        amountA: { type: number, minimum: 0 }
        amountB: { type: number, minimum: 0 }
        deltaAmount: { type: number }
        unit: { $ref: '#/components/schemas/CanonicalUnit' }
        rA:
          type: [number, 'null']
          minimum: 0
          description: Coverage ratio of A; `null` under `PRESENCE_ONLY`.
        rB:
          type: [number, 'null']
          minimum: 0
          description: Coverage ratio of B; `null` under `PRESENCE_ONLY`.
        uA: { type: number, minimum: 0 }
        uB: { type: number, minimum: 0 }
        weight: { type: number, minimum: 0 }
        deltaContribution:
          type: number
          description: weight x (uB - uA).
        flags:
          type: array
          items: { $ref: '#/components/schemas/DeltaRowFlag' }
    ExplanationParams:
      type: object
      description: |
        Parameters of the explanation key. `deltaCostPerDay`, `marginalRate`
        and `mRef` are money-typed: they are converted to the display currency
        like every other monetary field, and `currency` is rewritten to the
        display currency (the native currency while `meta.fx.status` is
        `UNAVAILABLE`). Parameters whose value is `null` are omitted; every
        number is rounded once to 4 decimals.
      required: [currency]
      properties:
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        deltaCostPerDay:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          x-money: true
        deltaContent: { type: number }
        marginalRate:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          x-money: true
        mRef:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          x-money: true
        ratio: { type: number }
      additionalProperties: false
    Explanation:
      type: object
      description: i18n key with parameters; never a prose sentence.
      required: [key, params]
      properties:
        key:
          type: string
          enum:
            - explain.verdict.worth_it
            - explain.verdict.marginal
            - explain.verdict.not_worth_it
            - explain.verdict.dominates
            - explain.verdict.equivalent
            - explain.verdict.insufficient_data
          example: explain.verdict.not_worth_it
        params: { $ref: '#/components/schemas/ExplanationParams' }
    CompareResponse:
      type: object
      description: |
        A is the cheaper product by cost per day. `deltaCost >= 0`; on equal
        cost `deltaContent >= 0`. `marginalRate` and `ratio` are `null` unless
        `deltaCost > 0`, `deltaContent > 0` and `mRef` is not `null`.
      required: [meta, swapped, verdict, productA, productB, deltaCost, deltaCostNative, deltaContent, marginalRate, mRef, ratio, rows, explanation]
      properties:
        meta: { $ref: '#/components/schemas/CompareMeta' }
        swapped:
          type: boolean
          description: '`true` when A is not the requested baseline.'
        verdict: { $ref: '#/components/schemas/Verdict' }
        productA: { $ref: '#/components/schemas/ComparedProduct' }
        productB: { $ref: '#/components/schemas/ComparedProduct' }
        deltaCost:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          minimum: 0
          description: Cost per day of B minus A in the display currency.
        deltaCostNative:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          minimum: 0
          description: Cost per day of B minus A in the native currency.
        deltaContent:
          type: number
          description: Content score of B minus A.
        marginalRate:
          type: [number, 'null']
          description: deltaCost / deltaContent in the display currency.
        mRef:
          type: [number, 'null']
          description: Market marginal rate in the display currency (median of cost per day per content point over market products with content above 0; with fewer than three such products, A's cost per day per content point; `null` when A's content is 0).
        ratio:
          type: [number, 'null']
          minimum: 0
          description: marginalRate / mRef.
        rows:
          type: array
          items: { $ref: '#/components/schemas/DeltaRow' }
        explanation: { $ref: '#/components/schemas/Explanation' }

    # ---------- Products ----------
    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    ProductListMeta:
      type: object
      required: [country, nativeCurrency, currency, fx, page, pageSize, total]
      properties:
        country: { $ref: '#/components/schemas/CountryCode' }
        nativeCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        fx: { $ref: '#/components/schemas/FxMeta' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    ProductSummary:
      type: object
      required: [id, code, brand, name, dosageForm, unitsPerContainer, unitsPerServing, servingsPerDay, provenance, cost, flags]
      properties:
        id: { type: string, format: uuid }
        code: { $ref: '#/components/schemas/ProductCode' }
        brand: { type: string }
        name: { type: string }
        dosageForm: { $ref: '#/components/schemas/DosageForm' }
        unitsPerContainer: { type: integer, minimum: 1 }
        unitsPerServing: { type: integer, minimum: 1 }
        servingsPerDay: { type: number, exclusiveMinimum: 0 }
        provenance: { $ref: '#/components/schemas/ProductProvenance' }
        cost:
          oneOf:
            - $ref: '#/components/schemas/Cost'
            - type: 'null'
          description: Effective-price cost with out-of-stock offers included; `null` when the product has no offer.
        flags:
          type: array
          items: { $ref: '#/components/schemas/ProductFlag' }
    ProductPage:
      type: object
      required: [meta, items]
      properties:
        meta: { $ref: '#/components/schemas/ProductListMeta' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
    ProductNutrient:
      type: object
      required: [code, category, amountPerServing, amountPerDay, unit, ulAmountPerServing, formCode, formLabel, conversionAssumed]
      properties:
        code: { $ref: '#/components/schemas/NutrientCode' }
        category: { $ref: '#/components/schemas/NutrientCategory' }
        amountPerServing:
          type: number
          exclusiveMinimum: 0
          description: Amount per serving in the canonical unit.
        amountPerDay:
          type: number
          exclusiveMinimum: 0
          description: Amount per day in the canonical unit.
        unit: { $ref: '#/components/schemas/CanonicalUnit' }
        ulAmountPerServing:
          type: [number, 'null']
          minimum: 0
          description: UL-relevant amount per serving when it differs from the scored amount; `null` means the full amount is UL-relevant.
        formCode:
          type: string
          description: Registry form code, `UNKNOWN` when the label form is not in the registry or not stated.
          example: UNKNOWN
        formLabel:
          type: [string, 'null']
          description: Form as printed on the label.
        conversionAssumed:
          type: boolean
          description: '`true` when an IU conversion assumed a form.'
    ProductAvailability:
      type: object
      required: [status, note]
      properties:
        status: { $ref: '#/components/schemas/AvailabilityStatus' }
        note: { type: [string, 'null'] }
    Offer:
      type: object
      required: [retailer, price, priceNative, currency, inStock, url, checkedAt, priceStale]
      properties:
        retailer: { type: string }
        price:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          exclusiveMinimum: 0
          description: Price in the display currency.
        priceNative:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          exclusiveMinimum: 0
          description: Price in the country's native currency.
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        inStock: { type: boolean }
        url: { type: string, format: uri, maxLength: 2048 }
        checkedAt: { type: string, format: date-time }
        priceStale:
          type: boolean
          description: '`true` when `checkedAt` is older than 30 days.'
    ProductDetail:
      type: object
      required: [id, code, brand, name, dosageForm, unitsPerContainer, unitsPerServing, servingsPerDay, gtin, synthetic, provenance, availability, nutrients, offers, cost, selectedOffer, flags, saved, alerts]
      properties:
        id: { type: string, format: uuid }
        code: { $ref: '#/components/schemas/ProductCode' }
        brand: { type: string }
        name: { type: string }
        dosageForm: { $ref: '#/components/schemas/DosageForm' }
        unitsPerContainer: { type: integer, minimum: 1 }
        unitsPerServing: { type: integer, minimum: 1 }
        servingsPerDay: { type: number, exclusiveMinimum: 0 }
        gtin: { type: [string, 'null'] }
        synthetic:
          type: boolean
          description: '`true` for synthetic fixture products; equals `provenance.synthetic`.'
        provenance: { $ref: '#/components/schemas/ProductProvenance' }
        availability: { $ref: '#/components/schemas/ProductAvailability' }
        nutrients:
          type: array
          items: { $ref: '#/components/schemas/ProductNutrient' }
        offers:
          type: array
          items: { $ref: '#/components/schemas/Offer' }
        cost:
          oneOf:
            - $ref: '#/components/schemas/Cost'
            - type: 'null'
          description: Effective-price cost with out-of-stock offers included; `null` when the product has no offer.
        selectedOffer:
          oneOf:
            - $ref: '#/components/schemas/SelectedOffer'
            - type: 'null'
        flags:
          type: array
          items: { $ref: '#/components/schemas/ProductFlag' }
        saved:
          type: boolean
          description: Whether the caller has a saved-product row for this product in `meta.country`; `false` for anonymous callers.
        alerts:
          type: array
          maxItems: 3
          description: The caller's alert subscriptions (active and inactive) on this product in `meta.country`, ordered by `trigger` (`PRICE_DROP`, `BACK_IN_STOCK`, `PRICE_CHANGE`); empty for anonymous callers.
          items: { $ref: '#/components/schemas/AlertSubscription' }
    ProductDetailMeta:
      type: object
      required: [country, nativeCurrency, currency, fx]
      properties:
        country: { $ref: '#/components/schemas/CountryCode' }
        nativeCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        fx: { $ref: '#/components/schemas/FxMeta' }
    ProductDetailResponse:
      type: object
      required: [meta, product]
      properties:
        meta: { $ref: '#/components/schemas/ProductDetailMeta' }
        product: { $ref: '#/components/schemas/ProductDetail' }

    # ---------- Plans ----------
    PlanLimits:
      type: object
      description: A `null` limit means unlimited.
      required: [code, name, savedProductsLimit, alertSubscriptionsLimit, notificationsPerMonthLimit]
      properties:
        code: { $ref: '#/components/schemas/PlanCode' }
        name: { type: string }
        savedProductsLimit: { type: [integer, 'null'], minimum: 0 }
        alertSubscriptionsLimit: { type: [integer, 'null'], minimum: 0 }
        notificationsPerMonthLimit: { type: [integer, 'null'], minimum: 0 }
    PlanPrice:
      type: object
      required: [amount, amountNative, currency, nativeCurrency, billingPeriod]
      properties:
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          exclusiveMinimum: 0
          description: Price in the display currency.
        amountNative:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          exclusiveMinimum: 0
          description: Price in the plan's stored currency.
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        nativeCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        billingPeriod:
          type: string
          enum: [MONTHLY]
    Plan:
      allOf:
        - $ref: '#/components/schemas/PlanLimits'
        - type: object
          required: [price]
          properties:
            price:
              oneOf:
                - $ref: '#/components/schemas/PlanPrice'
                - type: 'null'
              description: '`null` for FREE.'
    PlanList:
      type: object
      required: [meta, items]
      properties:
        meta: { $ref: '#/components/schemas/MoneyMeta' }
        items:
          type: array
          items: { $ref: '#/components/schemas/Plan' }

    # ---------- FX ----------
    FxCurrency:
      type: object
      required: [code, asOf, stale]
      properties:
        code: { $ref: '#/components/schemas/CurrencyCode' }
        asOf:
          type: [string, 'null']
          format: date
          description: Newest stored `as_of` of any rate row whose base or quote is this currency; `null` when no such row is stored.
        stale:
          type: boolean
          description: '`true` when `asOf` is more than 5 days before the current UTC date; `false` when `asOf` is `null`.'
    FxCurrencyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FxCurrency' }
    FxRate:
      type: object
      required: [quote, rate, asOf, source, stale]
      properties:
        quote: { $ref: '#/components/schemas/CurrencyCode' }
        rate:
          type: number
          exclusiveMinimum: 0
          description: Stored rate (`numeric(18,8)`), written with its 8 decimals and never rounded.
        asOf:
          type: string
          format: date
          description: ECB publication date of the rate.
        source:
          type: string
          enum: [FRANKFURTER]
        stale:
          type: boolean
          description: '`true` when `asOf` is more than 5 days before the current UTC date.'
    FxRateList:
      type: object
      required: [base, rates]
      properties:
        base: { $ref: '#/components/schemas/CurrencyCode' }
        rates:
          type: array
          items: { $ref: '#/components/schemas/FxRate' }
    FxRefreshResult:
      type: object
      required: [upsertedRows, failedBases]
      properties:
        upsertedRows:
          type: integer
          minimum: 0
          description: '`fx_rate` rows inserted or updated by this run (a repeated refresh of the same ECB date rewrites the rows and counts them again).'
        failedBases:
          type: array
          uniqueItems: true
          description: Base currencies whose provider call failed in this run, ordered ascending; their stored rates stay in use. Empty when every call succeeded.
          items: { $ref: '#/components/schemas/CurrencyCode' }

    # ---------- Session and account ----------
    UsageMeter:
      type: object
      required: [used, limit]
      properties:
        used: { type: integer, minimum: 0 }
        limit:
          type: [integer, 'null']
          minimum: 0
          description: '`null` means unlimited.'
    MonthlyUsageMeter:
      allOf:
        - $ref: '#/components/schemas/UsageMeter'
        - type: object
          required: [periodMonth]
          properties:
            periodMonth:
              type: string
              format: date
              description: First day of the current calendar month (UTC).
    Usage:
      type: object
      required: [savedProducts, alertSubscriptions, notificationsThisMonth]
      properties:
        savedProducts:
          allOf: [{ $ref: '#/components/schemas/UsageMeter' }]
          description: Counts saved-product rows over every country.
        alertSubscriptions:
          allOf: [{ $ref: '#/components/schemas/UsageMeter' }]
          description: Counts active subscriptions over every country.
        notificationsThisMonth:
          allOf: [{ $ref: '#/components/schemas/MonthlyUsageMeter' }]
          description: Notifications counted this calendar month (UTC); the cap notice and plan notifications are not counted.
    AnonymousQuota:
      type: object
      required: [principal, queriesUsed, queriesLimit, visibleResults]
      properties:
        principal: { const: ANONYMOUS }
        queriesUsed: { type: integer, minimum: 0 }
        queriesLimit: { type: integer, minimum: 0 }
        visibleResults: { type: integer, minimum: 0 }
    UserQuota:
      type: object
      required: [principal, plan, usage]
      properties:
        principal:
          type: string
          enum: [USER, ADMIN]
        plan: { $ref: '#/components/schemas/PlanCode' }
        usage: { $ref: '#/components/schemas/Usage' }
    SessionQuota:
      oneOf:
        - $ref: '#/components/schemas/AnonymousQuota'
        - $ref: '#/components/schemas/UserQuota'
    UserProfile:
      type: object
      required: [id, email, emailVerified, role, status, locale, defaultCountryCode, displayCurrency, emailAlertsEnabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { $ref: '#/components/schemas/Email' }
        emailVerified: { type: boolean }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        locale: { $ref: '#/components/schemas/Locale' }
        defaultCountryCode:
          oneOf:
            - $ref: '#/components/schemas/CountryCode'
            - type: 'null'
        displayCurrency:
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - type: 'null'
          description: Preferred display currency; `null` means the country's native currency.
        emailAlertsEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    Subscription:
      type: object
      required: [id, planCode, status, source, startedAt, currentPeriodEnd, canceledAt]
      properties:
        id: { type: string, format: uuid }
        planCode: { $ref: '#/components/schemas/PlanCode' }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        source: { $ref: '#/components/schemas/SubscriptionSource' }
        startedAt: { type: string, format: date-time }
        currentPeriodEnd:
          type: [string, 'null']
          format: date-time
          description: '`null` for the open-ended FREE subscription.'
        canceledAt: { type: [string, 'null'], format: date-time }
    Me:
      allOf:
        - $ref: '#/components/schemas/UserProfile'
        - type: object
          required: [plan, subscription, usage]
          properties:
            plan: { $ref: '#/components/schemas/PlanLimits' }
            subscription: { $ref: '#/components/schemas/Subscription' }
            usage: { $ref: '#/components/schemas/Usage' }
    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        displayCurrency:
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - type: 'null'
        locale: { $ref: '#/components/schemas/Locale' }
        defaultCountryCode: { $ref: '#/components/schemas/CountryCode' }
        emailAlertsEnabled: { type: boolean }
    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, format: password }

    # ---------- Auth ----------
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password:
          type: string
          format: password
          minLength: 10
          description: At least 10 characters and not in the breached-password list.
        locale: { $ref: '#/components/schemas/Locale' }
        countryCode: { $ref: '#/components/schemas/CountryCode' }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: base64url-encoded 256-bit token from the URL fragment of the e-mail link.
          pattern: '^[A-Za-z0-9_-]+$'
          minLength: 1
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { $ref: '#/components/schemas/Email' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { type: string, format: password, minLength: 1 }
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          minLength: 1
        newPassword:
          type: string
          format: password
          minLength: 10
          description: Same rules as registration.
    AuthTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          minimum: 1
          description: Access-token lifetime in seconds.
          example: 900
        user: { $ref: '#/components/schemas/UserProfile' }
    AcceptedMessage:
      type: object
      description: Generic acknowledgement; identical for known and unknown e-mail addresses.
      required: [messageKey]
      properties:
        messageKey:
          type: string
          description: i18n key of the message shown to the user.

    # ---------- Saved products ----------
    SaveProductRequest:
      type: object
      required: [productId, countryCode]
      properties:
        productId: { type: string, format: uuid }
        countryCode: { $ref: '#/components/schemas/CountryCode' }
    SavedProductRef:
      type: object
      required: [productId, countryCode, savedAt]
      properties:
        productId: { type: string, format: uuid }
        countryCode: { $ref: '#/components/schemas/CountryCode' }
        savedAt: { type: string, format: date-time }
    SavedProduct:
      type: object
      required: [productId, code, brand, name, dosageForm, provenance, countryCode, savedAt, availabilityStatus, cost, selectedOffer, flags, alerts]
      properties:
        productId: { type: string, format: uuid }
        code: { $ref: '#/components/schemas/ProductCode' }
        brand: { type: string }
        name: { type: string }
        dosageForm: { $ref: '#/components/schemas/DosageForm' }
        provenance: { $ref: '#/components/schemas/ProductProvenance' }
        countryCode: { $ref: '#/components/schemas/CountryCode' }
        savedAt:
          type: string
          format: date-time
          description: '`saved_product.created_at`.'
        availabilityStatus:
          allOf:
            - $ref: '#/components/schemas/AvailabilityStatus'
          description: Availability in `countryCode`; `NOT_SOLD` when no availability row exists.
        cost:
          oneOf:
            - $ref: '#/components/schemas/Cost'
            - type: 'null'
          description: Current effective-price cost with out-of-stock offers included; `null` without offers or when `availabilityStatus` is not `AVAILABLE`.
        selectedOffer:
          oneOf:
            - $ref: '#/components/schemas/SelectedOffer'
            - type: 'null'
          description: Offer behind `cost`; `null` exactly when `cost` is `null`.
        flags:
          type: array
          description: 'Not `AVAILABLE`: exactly `UNAVAILABLE_IN_COUNTRY`. Otherwise the `GET /products` flags in the order `CONVERSION_ASSUMED`, `PRICE_STALE`, `OUT_OF_STOCK`, `FX_STALE`, `FX_UNAVAILABLE` (FX flags only with a cost).'
          items: { $ref: '#/components/schemas/ProductFlag' }
        alerts:
          type: array
          maxItems: 3
          description: The caller's active alert subscriptions on this product in this country, ordered by `trigger` (`PRICE_DROP`, `BACK_IN_STOCK`, `PRICE_CHANGE`).
          items: { $ref: '#/components/schemas/AlertSubscription' }
    SavedProductListMeta:
      type: object
      required: [country, nativeCurrency, currency, fx]
      properties:
        country: { $ref: '#/components/schemas/CountryCode' }
        nativeCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        fx: { $ref: '#/components/schemas/FxMeta' }
    SavedProductList:
      type: object
      required: [meta, items]
      properties:
        meta: { $ref: '#/components/schemas/SavedProductListMeta' }
        items:
          type: array
          items: { $ref: '#/components/schemas/SavedProduct' }

    # ---------- Alerts ----------
    ThresholdPercent:
      type: number
      minimum: 0.01
      maximum: 99.99
      description: |
        Minimum price drop in percent of the baseline price (`PRICE_DROP`
        only), stored as `numeric(5,2)`: from 0.01 to 99.99 with at most 2
        decimal places once trailing zeros are removed. A value outside the
        range or with more decimals is 422 `validation_failed` with
        `errors[].code = out_of_range`; it is never rounded. Returned as a
        JSON number (for example `5` or `7.5`). The alert fires when
        `after.effectivePrice <= baselinePrice x (1 - thresholdPercent / 100)`.
      example: 5.0
    AlertSubscription:
      type: object
      required: [id, productId, countryCode, trigger, thresholdPercent, baselinePrice, baselineCurrency, active, createdAt, lastTriggeredAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        countryCode: { $ref: '#/components/schemas/CountryCode' }
        trigger: { $ref: '#/components/schemas/AlertTrigger' }
        thresholdPercent:
          oneOf:
            - $ref: '#/components/schemas/ThresholdPercent'
            - type: 'null'
          description: Set for `PRICE_DROP`, `null` otherwise.
        baselinePrice:
          type: [number, 'null']
          exclusiveMinimum: 0
          description: |
            Baseline effective price (`numeric(12,2)`) in the country's native
            currency, never converted to the display currency (`PRICE_DROP`
            only). Set on creation, activation and threshold change to the
            current effective price, and after each notification to the
            triggering price; `null` until a first price exists, and always
            `null` for the other triggers.
        baselineCurrency:
          allOf:
            - $ref: '#/components/schemas/CurrencyCode'
          description: Native currency of the country (the currency of `baselinePrice`).
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastTriggeredAt:
          type: [string, 'null']
          format: date-time
          description: When the subscription last produced a notification; `null` until then. A firing skipped by the monthly cap sets neither this nor the baseline.
    ProductRef:
      type: object
      required: [id, code, brand, name, availabilityStatus, provenance]
      properties:
        id: { type: string, format: uuid }
        code: { $ref: '#/components/schemas/ProductCode' }
        brand: { type: string }
        name: { type: string }
        availabilityStatus:
          allOf:
            - $ref: '#/components/schemas/AvailabilityStatus'
          description: Availability in the subscription's country (`NOT_SOLD` when no availability row exists); anything but `AVAILABLE` is shown with the `UNAVAILABLE_IN_COUNTRY` badge.
        provenance: { $ref: '#/components/schemas/ProductProvenance' }
    AlertListItem:
      allOf:
        - $ref: '#/components/schemas/AlertSubscription'
        - type: object
          required: [product]
          properties:
            product: { $ref: '#/components/schemas/ProductRef' }
    AlertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AlertListItem' }
    CreateAlertRequest:
      type: object
      required: [productId, countryCode, trigger]
      properties:
        productId: { type: string, format: uuid }
        countryCode: { $ref: '#/components/schemas/CountryCode' }
        trigger: { $ref: '#/components/schemas/AlertTrigger' }
        thresholdPercent:
          oneOf:
            - $ref: '#/components/schemas/ThresholdPercent'
            - type: 'null'
          description: '`PRICE_DROP` only; absent or `null` means 5.00. A non-null value with another trigger is 422 `threshold_not_allowed`.'
    UpdateAlertRequest:
      type: object
      minProperties: 1
      description: At least one of `active` and `thresholdPercent`; `null` values are rejected with 422.
      properties:
        active: { type: boolean }
        thresholdPercent: { $ref: '#/components/schemas/ThresholdPercent' }

    # ---------- Notifications ----------
    OfferState:
      type: object
      description: |
        Effective-price state of a product in a country (section 7.4,
        out-of-stock offers included) as carried by the `OFFERS_CHANGED`
        event; every field is `null` when no offer exists.
      required: [effectivePrice, inStock, retailer, url]
      properties:
        effectivePrice:
          type: [number, 'null']
          exclusiveMinimum: 0
          description: Native currency of the country (`currency` of the payload), 2 decimals as stored; never converted.
        inStock: { type: [boolean, 'null'] }
        retailer: { type: [string, 'null'] }
        url: { type: [string, 'null'], format: uri, maxLength: 2048 }
    AlertNotificationPayload:
      type: object
      description: |
        Payload of `ALERT_PRICE_DROP`, `ALERT_BACK_IN_STOCK` and
        `ALERT_PRICE_CHANGE`: a snapshot written when the notification is
        created; later catalog changes or a deleted subscription do not alter
        it. Every amount (`before.effectivePrice`, `after.effectivePrice`,
        `baselinePrice`) is in the country's native currency `currency` and
        is never converted to a display currency: the inbox and the alert
        e-mail render it with `currency`.
      required: [subscriptionId, trigger, productId, productCode, brand, productName, countryCode, currency, thresholdPercent, baselinePrice, before, after]
      properties:
        subscriptionId:
          type: string
          format: uuid
          description: Subscription that fired; it may have been deleted since.
        trigger: { $ref: '#/components/schemas/AlertTrigger' }
        productId: { type: string, format: uuid }
        productCode: { $ref: '#/components/schemas/ProductCode' }
        brand: { type: string }
        productName: { type: string }
        countryCode: { $ref: '#/components/schemas/CountryCode' }
        currency:
          allOf:
            - $ref: '#/components/schemas/CurrencyCode'
          description: Native currency of `countryCode`.
        thresholdPercent:
          oneOf:
            - $ref: '#/components/schemas/ThresholdPercent'
            - type: 'null'
          description: Threshold in effect when the alert fired (`PRICE_DROP`); `null` for the other triggers.
        baselinePrice:
          type: [number, 'null']
          exclusiveMinimum: 0
          description: Baseline the drop was measured against (`PRICE_DROP`), native; `null` for the other triggers.
        before: { $ref: '#/components/schemas/OfferState' }
        after: { $ref: '#/components/schemas/OfferState' }
    CapReachedPayload:
      type: object
      description: Payload of `NOTIFICATION_CAP_REACHED` (at most one per user and calendar month, not counted against the cap).
      required: [periodMonth, limit]
      properties:
        periodMonth:
          type: string
          format: date
          description: First day of the capped calendar month (UTC).
        limit:
          type: integer
          minimum: 0
          description: The plan's monthly notification limit that was reached.
    PlanActivatedPayload:
      type: object
      description: Payload of `PLAN_ACTIVATED` (from `SubscriptionActivatedEvent`; not counted against the cap).
      required: [planCode, source, currentPeriodEnd, extended]
      properties:
        planCode: { $ref: '#/components/schemas/PlanCode' }
        source: { $ref: '#/components/schemas/SubscriptionSource' }
        currentPeriodEnd:
          type: [string, 'null']
          format: date-time
          description: End of the activated or extended period.
        extended:
          type: boolean
          description: '`true` when an existing PRO period was extended.'
    PlanExpiredPayload:
      type: object
      description: Payload of `PLAN_EXPIRED` (from `SubscriptionExpiredEvent`; not counted against the cap).
      required: [expiredPlanCode, planCode, deactivatedAlertSubscriptions]
      properties:
        expiredPlanCode:
          allOf:
            - $ref: '#/components/schemas/PlanCode'
          description: The plan that expired (`PRO`).
        planCode:
          allOf:
            - $ref: '#/components/schemas/PlanCode'
          description: The plan now active (`FREE`).
        deactivatedAlertSubscriptions:
          type: integer
          minimum: 0
          description: Alert subscriptions set inactive because they exceeded the new plan's limit.
    NotificationBase:
      type: object
      required: [id, type, payload, createdAt, readAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        createdAt: { type: string, format: date-time }
        readAt:
          type: [string, 'null']
          format: date-time
          description: First time the notification was marked read; `null` while unread.
    AlertNotification:
      allOf:
        - $ref: '#/components/schemas/NotificationBase'
        - type: object
          properties:
            type:
              type: string
              enum: [ALERT_PRICE_DROP, ALERT_BACK_IN_STOCK, ALERT_PRICE_CHANGE]
            payload: { $ref: '#/components/schemas/AlertNotificationPayload' }
    CapReachedNotification:
      allOf:
        - $ref: '#/components/schemas/NotificationBase'
        - type: object
          properties:
            type: { const: NOTIFICATION_CAP_REACHED }
            payload: { $ref: '#/components/schemas/CapReachedPayload' }
    PlanActivatedNotification:
      allOf:
        - $ref: '#/components/schemas/NotificationBase'
        - type: object
          properties:
            type: { const: PLAN_ACTIVATED }
            payload: { $ref: '#/components/schemas/PlanActivatedPayload' }
    PlanExpiredNotification:
      allOf:
        - $ref: '#/components/schemas/NotificationBase'
        - type: object
          properties:
            type: { const: PLAN_EXPIRED }
            payload: { $ref: '#/components/schemas/PlanExpiredPayload' }
    Notification:
      description: One inbox entry; `type` selects the payload schema.
      oneOf:
        - $ref: '#/components/schemas/AlertNotification'
        - $ref: '#/components/schemas/CapReachedNotification'
        - $ref: '#/components/schemas/PlanActivatedNotification'
        - $ref: '#/components/schemas/PlanExpiredNotification'
      discriminator:
        propertyName: type
        mapping:
          ALERT_PRICE_DROP: '#/components/schemas/AlertNotification'
          ALERT_BACK_IN_STOCK: '#/components/schemas/AlertNotification'
          ALERT_PRICE_CHANGE: '#/components/schemas/AlertNotification'
          NOTIFICATION_CAP_REACHED: '#/components/schemas/CapReachedNotification'
          PLAN_ACTIVATED: '#/components/schemas/PlanActivatedNotification'
          PLAN_EXPIRED: '#/components/schemas/PlanExpiredNotification'
    NotificationPage:
      type: object
      required: [meta, items]
      properties:
        meta: { $ref: '#/components/schemas/PageMeta' }
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
    UnreadCount:
      type: object
      required: [unreadCount]
      properties:
        unreadCount: { type: integer, minimum: 0 }

    # ---------- Subscription ----------
    PromoRedeemRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: >-
            The code to redeem. Any string is accepted; a value that does not match
            `PromoCodeValue` is rejected with the same 400 `promo_invalid` as an
            unknown code.
          example: LAUNCH-7K3M9QXT2B4N6PRW
    SubscriptionActivation:
      type: object
      required: [plan, subscription]
      properties:
        plan: { $ref: '#/components/schemas/PlanCode' }
        subscription: { $ref: '#/components/schemas/Subscription' }

    # ---------- Admin ----------
    ComponentHealth:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/HealthStatus' }
    FxHealth:
      type: object
      required: [status, newestAsOf, rateAgeDays, stale]
      properties:
        status: { $ref: '#/components/schemas/HealthStatus' }
        newestAsOf:
          type: [string, 'null']
          format: date
          description: Newest `as_of` over all stored rates; `null` when no rate is stored.
        rateAgeDays:
          type: [integer, 'null']
          minimum: 0
          description: Current UTC date minus `newestAsOf` in whole days; `null` when no rate is stored.
        stale:
          type: boolean
          description: '`rateAgeDays > 5`; `false` when no rate is stored (the status is then `DEGRADED`).'
    OutboxHealth:
      description: Outbox counts (as `OutboxStats`) with a status.
      allOf:
        - $ref: '#/components/schemas/OutboxStats'
        - type: object
          required: [status]
          properties:
            status: { $ref: '#/components/schemas/HealthStatus' }
    JobRun:
      type: object
      required: [name, lastRunAt, lastOutcome]
      properties:
        name:
          type: string
          description: Scheduled job; the housekeeping job is reported per package (one advisory lock each, ADR-0011).
          enum: [OUTBOX_PROCESSOR, FX_REFRESH, SUBSCRIPTION_EXPIRY, HOUSEKEEPING_IDENTITY, HOUSEKEEPING_ALERTS]
        lastRunAt:
          type: [string, 'null']
          format: date-time
          description: End of the last run that obtained the lock since the API started; `null` before the first.
        lastOutcome:
          type: [string, 'null']
          enum: [SUCCEEDED, FAILED, null]
          description: '`FAILED` when the run ended with an exception (an FX run with at least one failed base also counts as `FAILED`); `null` before the first run.'
    AdminHealth:
      type: object
      required: [status, checkedAt, components, jobs]
      properties:
        status: { $ref: '#/components/schemas/HealthStatus' }
        checkedAt: { type: string, format: date-time }
        components:
          type: object
          required: [scoring, database, fx, outbox]
          properties:
            scoring: { $ref: '#/components/schemas/ComponentHealth' }
            database: { $ref: '#/components/schemas/ComponentHealth' }
            fx: { $ref: '#/components/schemas/FxHealth' }
            outbox: { $ref: '#/components/schemas/OutboxHealth' }
        jobs:
          type: array
          items: { $ref: '#/components/schemas/JobRun' }
    OutboxStats:
      type: object
      required: [pending, failed, deadLetter, oldestPendingAt]
      properties:
        pending:
          type: integer
          minimum: 0
          description: Events with `processed_at IS NULL` (claimed or not).
        failed:
          type: integer
          minimum: 0
          description: Pending events with `attempts > 0` (waiting for a retry).
        deadLetter:
          type: integer
          minimum: 0
          description: Retained events with outcome `DEAD_LETTER` (kept 90 days).
        oldestPendingAt:
          type: [string, 'null']
          format: date-time
          description: '`created_at` of the oldest pending event; `null` when nothing is pending.'
    ProductsImportDocument:
      description: Products document; validated against `contracts/schemas/import-products.schema.json` before any write.
      $ref: './schemas/import-products.schema.json'
    OffersImportUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: text/csv
          description: Offers CSV with a `product_code` column, at most 20 MB.
    ImportSummary:
      type: object
      description: |
        Row counts of the import (camelCase keys). `OFFERS_CSV`: `rows` (data
        rows read), `inserted`, `updated`, `unchanged`, `deleted`,
        `changedPairs`. `PRODUCTS_JSON`: `products` (products in the
        document), `inserted`, `updated`, `unchanged`, `deleted` (summed over
        every written table) and `changedPairs`. A `FAILED` job reports the
        rows or products read and 0 for every write count.
      additionalProperties: { type: integer, minimum: 0 }
    ImportJob:
      type: object
      required: [id, kind, status, createdAt, finishedAt, summary]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ImportJobKind' }
        status: { $ref: '#/components/schemas/ImportJobStatus' }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        summary:
          oneOf:
            - $ref: '#/components/schemas/ImportSummary'
            - type: 'null'
    ImportJobError:
      type: object
      required: [rowNumber, message]
      properties:
        rowNumber:
          type: integer
          minimum: 1
          description: |
            `OFFERS_CSV`: 1-based record number in the file, header included
            (the first data row is 2); file-level failures use 1.
            `PRODUCTS_JSON`: 1-based position of the product in `products`;
            document-level failures (encoding, JSON syntax, top-level schema
            violations) use 1 and name their location in `message`.
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Machine-readable error code, the prefix of `message` (for example `invalid_csv`, `wrong_column_count`, `currency_mismatch`, `invalid_offer_url`, `unsupported_iu_form`, `schema_violation`, `too_many_records`, `field_too_long`, `too_many_errors`).
        message:
          type: string
          maxLength: 2000
          description: '`<code>: <detail> (<location>)`, where the location is `row N` for CSV records or a JSON path such as `products[2].nutrients[0].unit`.'
    ImportJobDetail:
      allOf:
        - $ref: '#/components/schemas/ImportJob'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items: { $ref: '#/components/schemas/ImportJobError' }
    AdminUser:
      type: object
      required: [id, email, role, status, plan, emailVerified, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { $ref: '#/components/schemas/Email' }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        plan: { $ref: '#/components/schemas/PlanCode' }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
    AdminUserPage:
      type: object
      required: [meta, items]
      properties:
        meta: { $ref: '#/components/schemas/PageMeta' }
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
    GrantSubscriptionRequest:
      type: object
      required: [planCode, durationDays]
      properties:
        planCode:
          type: string
          enum: [PRO]
        durationDays: { type: integer, minimum: 1, maximum: 3650 }
    SetUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/UserStatus' }
    CreatePromoCodeRequest:
      type: object
      required: [planCode, durationDays, maxRedemptions, expiresAt]
      properties:
        prefix:
          type: string
          pattern: '^[A-Za-z0-9]{1,16}$'
          description: Optional human-readable prefix.
        planCode:
          type: string
          enum: [PRO]
        durationDays: { type: integer, minimum: 1, maximum: 3650 }
        maxRedemptions: { type: integer, minimum: 1 }
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: '`null` for a code that never expires; otherwise it must lie in the future (422, code `not_in_future`).'
    PromoCode:
      type: object
      required: [code, planCode, durationDays, maxRedemptions, redeemedCount, expiresAt, createdBy]
      properties:
        code: { $ref: '#/components/schemas/PromoCodeValue' }
        planCode: { $ref: '#/components/schemas/PlanCode' }
        durationDays: { type: integer, minimum: 1 }
        maxRedemptions: { type: integer, minimum: 1 }
        redeemedCount: { type: integer, minimum: 0 }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdBy: { type: [string, 'null'], format: uuid }
    PromoCodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PromoCode' }
