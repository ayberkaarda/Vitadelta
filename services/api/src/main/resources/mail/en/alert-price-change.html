<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VitaDelta</title>
</head>
<body style="margin:0;padding:24px;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2933;line-height:1.5;">
<div style="max-width:560px;margin:0 auto;background-color:#ffffff;padding:24px;border-radius:8px;">
<p>Hello,</p>
<p>The price of <strong th:text="${productName}"></strong> (<span th:text="${brand}"></span>, <span th:text="${productCode}"></span>) in <span th:text="${countryCode}"></span> changed from <span th:text="${oldPrice}"></span> to <strong th:text="${newPrice}"></strong> (<span th:text="${retailer}"></span>).</p>
<p><a th:href="${homeUrl}" style="display:inline-block;padding:12px 20px;background-color:#1d6f42;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:bold;">Open VitaDelta</a></p>
<p style="font-size:13px;color:#52606d;">VitaDelta shows comparative information only; it is not medical advice.</p>
</div>
<p style="max-width:560px;margin:16px auto 0;font-size:12px;color:#7b8794;">You receive this e-mail because of an alert on your VitaDelta account.<br><a th:href="${preferencesUrl}" style="color:#52606d;">Change your notification preferences</a> &middot; <a th:href="${privacyUrl}" style="color:#52606d;">Privacy notice</a></p>
</body>
</html>
