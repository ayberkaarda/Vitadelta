# Configuration comes from VITADELTA_* environment variables (documented in .env.example).
# Secrets have no defaults: the application refuses to start without VITADELTA_JWT_SECRET,
# VITADELTA_COOKIE_SECRET and VITADELTA_WEB_BASE_URL (bound below to vitadelta.secrets.* and
# vitadelta.web.*, validated by the classes in com.vitadelta.api.config.properties).
spring:
  application:
    name: vitadelta-api
  main:
    banner-mode: "off"
  datasource:
    url: ${VITADELTA_DB_URL}
    username: ${VITADELTA_DB_USERNAME}
    password: ${VITADELTA_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    # V3 is delivered after V4 and V5: out-of-order lets a database that is already at V5 apply
    # it later. Validation is unchanged (checksums, missing and failed
    # migrations are still errors; only the version order of pending migrations is relaxed).
    out-of-order: true
    clean-disabled: true
  mail:
    host: ${VITADELTA_SMTP_HOST:}
    port: ${VITADELTA_SMTP_PORT:587}
    username: ${VITADELTA_SMTP_USERNAME:}
    password: ${VITADELTA_SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.starttls.enable]": ${VITADELTA_SMTP_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${VITADELTA_SMTP_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
  thymeleaf:
    # Mail templates live under resources/mail/{tr,en}; the mail package configures its own
    # template resolver. No web views are rendered.
    check-template-location: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: vitadelta-job-
  web:
    resources:
      add-mappings: false

vitadelta:
  secrets:
    jwt-secret: ${VITADELTA_JWT_SECRET:}
    jwt-secret-previous: ${VITADELTA_JWT_SECRET_PREVIOUS:}
    cookie-secret: ${VITADELTA_COOKIE_SECRET:}
  web:
    origins: ${VITADELTA_WEB_ORIGINS:}
    base-url: ${VITADELTA_WEB_BASE_URL:}
    # https is required for base-url and cookies are Secure outside the dev profile.
    require-https: true
    secure-cookies: true
  proxy:
    trust-proxy: ${VITADELTA_TRUST_PROXY:false}
    trusted-proxies: ${VITADELTA_TRUSTED_PROXIES:}
  mail:
    from: ${VITADELTA_MAIL_FROM:}
    # Asynchronous identity and plan e-mail (AuthMailDispatcher): sender threads, bounded queue
    # (a full queue drops the mail with the vitadelta.mail.dropped metric) and how long shutdown
    # waits for queued mails.
    dispatch:
      pool-size: 2
      queue-capacity: 500
      shutdown-timeout: 10s
  anonymous:
    query-limit: ${VITADELTA_ANON_QUERY_LIMIT:3}
    visible-results: ${VITADELTA_ANON_VISIBLE_RESULTS:3}
  bootstrap-admin:
    email: ${VITADELTA_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${VITADELTA_BOOTSTRAP_ADMIN_PASSWORD:}
  operations:
    # false disables every scheduler, including SubscriptionExpiryJob (daily 00:05 UTC, section 8.3).
    jobs-enabled: ${VITADELTA_JOBS_ENABLED:true}
    unverified-account-ttl-days: ${VITADELTA_UNVERIFIED_ACCOUNT_TTL_DAYS:30}
    privacy-contact: ${VITADELTA_PRIVACY_CONTACT:}
    # The privacy notice needs a contact: startup fails without VITADELTA_PRIVACY_CONTACT except in
    # the dev profile (section 15.9).
    require-privacy-contact: true
  catalog:
    # Age after which the selected offer of a product is flagged PRICE_STALE (section 7.4).
    price-stale-after-days: 30
    # Admin imports run on a bounded executor: workers and imports that may wait for one (a full
    # queue fails the new import job at once). Waiting imports hold no database connection.
    import-threads: 1
    import-queue-capacity: 4
    # Bounds of one import file: data rows of an offers CSV, products of a products document,
    # characters of one field, and collected errors (a failing job stores at most this many,
    # plus one summary error when more were found).
    import-limits:
      max-offer-rows: 200000
      max-products: 50000
      max-field-length: 4096
      max-errors: 1000
  scoring:
    # Scoring service (section 7.6); retry and circuit breaker: resilience4j.*.instances.scoring.
    base-url: ${VITADELTA_SCORING_BASE_URL:}
    connect-timeout: 500ms
    read-timeout: 2s
    # Bulkhead: scoring calls in flight at once; a call beyond it is answered 503 at once.
    max-concurrent-calls: 16
  fx:
    # FX provider (section 7.7, ADR-0009): Frankfurter v2 with the ECB provider. Blank -> default.
    base-url: ${VITADELTA_FX_BASE_URL:https://api.frankfurter.dev/v2}
    # Display currencies in addition to the country currencies (comma-separated ISO 4217 codes).
    # A code the provider does not publish is left out of each refresh request with a WARN log
    # line and the vitadelta.fx.refresh.unsupported metric; it then has no rate (UNAVAILABLE).
    extra-currencies: ${VITADELTA_FX_EXTRA_CURRENCIES:}
    connect-timeout: 2s
    read-timeout: 5s
    # Largest accepted provider body; a larger answer fails the fetch.
    max-response-bytes: 65536
    # FxRefreshJob: at start-up only when no rate is stored or the newest is older than
    # startup-max-age days, then every refresh-interval. Off with VITADELTA_JOBS_ENABLED=false.
    refresh-interval: 6h
    startup-max-age: 1
    # fx_stale_after_days: older rates set meta.fx.stale and the FX_STALE flag.
    stale-after-days: 5
    # Rate lookups are cached per currency pair; every refresh clears the cache.
    lookup-cache-ttl: 60s
  health:
    # The public GET /health answers from an overall status computed at most this often.
    public-cache-ttl: 10s
    # Outbox health: DEGRADED when the oldest pending event is older than this.
    outbox-max-pending-age: 5m
    # Engine parameters of GET /weights/defaults (scoring GET /internal/v1/health): read in the
    # background at start-up; while none was obtained, a request tries again at most this often.
    engine-retry-interval: 30s
  recommendation:
    # Ranking cache (section 7.5): full native rankings per canonical query and catalog version,
    # bounded by entries and by the ranked products held in total.
    cache-ttl: 10m
    cache-max-entries: 500
    cache-max-ranked-items: 100000
    # Largest country catalog a recommendation or comparison loads (more: operator error, 503).
    max-products-per-country: 5000
  http:
    # Request body limits of /api/v1/** (query body 64 kB; import JSON and CSV 20 MB).
    max-body: 64KB
    import-max-body: 20MB
    import-paths: /api/v1/admin/imports/
  seed:
    # Directory holding reference/, fixtures/ and real/. scripts/seed.sh mounts the repository's
    # data directory read-only at this path inside the api container. The API also reads
    # reference/weak_passwords.txt (breached-password list, section 8.2) from it at every startup
    # and refuses to start when the file is missing.
    data-dir: /data
  identity:
    # The breached-password list can be moved with vitadelta.identity.weak-passwords-file
    # (default <vitadelta.seed.data-dir>/reference/weak_passwords.txt).
    # Retention of the daily identity housekeeping purge (section 8.11, 03:15 UTC).
    anonymous-retention: 180d
    email-token-retention: 7d
    refresh-token-retention: 30d
    housekeeping-batch-size: 1000
  alerts:
    # Outbox processor (section 8.6, ADR-0008): fixed delay between runs, events claimed per run,
    # claim lease (an expired lease makes an event claimable again) and failed attempts after
    # which an event becomes DEAD_LETTER. Off with VITADELTA_JOBS_ENABLED=false.
    poll-interval: 10s
    claim-batch-size: 100
    lease: 2m
    max-attempts: 5
    # Outbox housekeeping (section 8.11, daily 03:15 UTC): processed events and dead letters older
    # than these are deleted with their alert_delivery rows, in batches of housekeeping-batch-size.
    processed-retention: 30d
    dead-letter-retention: 90d
    housekeeping-batch-size: 1000

server:
  port: 8080
  # The socket peer stays the real peer; X-Forwarded-For is evaluated only by ClientIpResolver.
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  server:
    # Actuator runs on its own port, which is neither published by compose nor proxied by nginx.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
  health:
    mail:
      # SMTP outages are handled by the asynchronous mail dispatch and reported in
      # /api/v1/admin/health; they do not make the service unhealthy.
      enabled: false

resilience4j:
  # Scoring client resilience (section 7.6, ADR-0003). Retry wraps the circuit breaker, so every
  # attempt is recorded by the breaker.
  retry:
    instances:
      scoring:
        # One retry, on connection errors only (never on a response, a 4xx/5xx or a read timeout).
        max-attempts: 2
        wait-duration: 100ms
        retry-exception-predicate: com.vitadelta.api.recommendation.ConnectionErrors
  circuitbreaker:
    instances:
      scoring:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        # Only unavailability counts as failure: I/O errors (connect, timeouts) and 5xx answers.
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

springdoc:
  # The API description is served at /api/v1/openapi.json (no UI); it is compared with
  # contracts/public-api.openapi.yaml by OpenApiContractTest.
  api-docs:
    path: /api/v1/openapi.json
    version: openapi_3_1
  use-fqn: true
  paths-to-match: /api/v1/**
  writer-with-order-by-keys: true

logging:
  # Loggers that print request data by design (request lines and query strings, controller
  # arguments, message-converter output, security decisions, raw request bytes, SQL bind values)
  # are pinned to INFO, so raising the root level (LOGGING_LEVEL_ROOT=DEBUG) never enables them.
  # Raising one of them takes an explicit entry for that logger, for example
  # LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB=DEBUG, and is meant for local development only: the
  # redactor still masks credentials, cookies and e-mail addresses, but these lines carry request
  # data that is not otherwise logged.
  level:
    "[org.springframework.web]": INFO
    "[org.springframework.http]": INFO
    "[org.springframework.security]": INFO
    "[org.springframework.jdbc.core]": INFO
    "[org.apache.coyote]": INFO
    "[org.apache.tomcat.util.net]": INFO
    "[org.apache.tomcat.util.http]": INFO
    "[org.hibernate.orm.jdbc.bind]": INFO
    "[org.hibernate.orm.jdbc.extract]": INFO
    "[org.hibernate.SQL]": INFO
  structured:
    format:
      console: logstash
    json:
      # Removes credentials and personal data from every log line (LogRedactor).
      customizer: com.vitadelta.api.common.logging.RedactingJsonMembersCustomizer
