[project]
name = "vitadelta-scoring"
version = "0.1.0"
description = "Stateless scoring service for Vitadelta"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitadelta_scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
