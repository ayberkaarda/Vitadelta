version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      # Angular packages are released together and must move as one set.
      angular:
        patterns:
          - "@angular/*"
          - "angular-eslint"
    ignore:
      # Angular 22 accepts TypeScript >=6.0 <6.1 only; newer TypeScript lines
      # are taken together with the Angular release that supports them.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: npm
    # Isolated generator package of the web API types (openapi-typescript on TypeScript 5.x).
    directory: /apps/web/tools/openapi
    schedule:
      interval: weekly
    ignore:
      # openapi-typescript 7 supports TypeScript 5.x only.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: uv
    directory: /services/scoring
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /services/api
    schedule:
      interval: weekly
  # Actions are pinned by commit SHA with the version in a comment; Dependabot moves both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Base images are pinned by tag and digest (FROM <image>:<tag>@sha256:<digest>); Dependabot
  # proposes the next tag together with its digest.
  - package-ecosystem: docker
    directories:
      - /infra/nginx
      - /services/api
      - /services/scoring
    schedule:
      interval: weekly
  # Images of the compose files (PostgreSQL, Mailpit), pinned the same way.
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
