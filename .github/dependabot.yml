version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      # Angular packages are released together and must move as one set.
      angular:
        patterns:
          - "@angular/*"
          - "angular-eslint"
    ignore:
      # Angular 22 accepts TypeScript >=6.0 <6.1 only; newer TypeScript lines
      # are taken together with the Angular release that supports them.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: uv
    directory: /services/scoring
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /services/api
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
